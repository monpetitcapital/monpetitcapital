<div class="ph" id="app"><div class="sb"><span style="font-size:11px;font-weight:700;color:#0F172A">9:41</span><div style="width:54px;height:16px;background:#09152A;border-radius:10px"></div><div style="display:flex;gap:4px;align-items:center"><svg width="13" height="10" viewBox="0 0 16 12"><rect x="0" y="5" width="3" height="7" rx=".5" fill="#0F172A" opacity=".3"/><rect x="4.5" y="3" width="3" height="9" rx=".5" fill="#0F172A" opacity=".55"/><rect x="9" y="1" width="3" height="11" rx=".5" fill="#0F172A" opacity=".8"/><rect x="13.5" y="0" width="2.5" height="12" rx=".5" fill="#0F172A"/></svg><svg width="22" height="11" viewBox="0 0 26 13"><rect x="0" y="1" width="23" height="11" rx="2" stroke="#0F172A" stroke-width="1.5" fill="none"/><rect x="23" y="4" width="2.5" height="5" rx="1" fill="#0F172A" opacity=".4"/><rect x="1.5" y="2.5" width="16" height="8" rx="1.5" fill="#0F172A"/></svg></div></div><div id="sc" class="co" style="top:40px;bottom:54px"></div><div class="ta" id="tabs" style="display:none"><div class="ti" id="t0" onclick="TAB(0)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke-width="1.5" id="ti0"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg><span style="font-size:7px" id="tl0">Accueil</span></div><div class="ti" id="t1" onclick="TAB(1)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke-width="1.5" id="ti1"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg><span style="font-size:7px" id="tl1">Parcours</span></div><div class="ti" id="t2" onclick="TAB(2)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke-width="1.5" id="ti2"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg><span style="font-size:7px" id="tl2">Simulateurs</span></div><div class="ti" id="t3" onclick="TAB(3)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke-width="1.5" id="ti3"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg><span style="font-size:7px" id="tl3">Budget</span></div><div class="ti" id="t4" onclick="TAB(4)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke-width="1.5" id="ti4"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg><span style="font-size:7px" id="tl4">Compte</span></div></div></div>
<script>var _D={arts:{"a00":{"mod":"Module 0","modId":"m0","ch":"1 / 4","title":"Pourquoi je me sens perdu avec l'argent","tag":"Fondamentaux","tb":"#FEF3C7","tc":"#92400E","min":4,"acc":"Parler d'argent met mal à l'aise. Se sentir perdu face aux sujets financiers est bien plus courant qu'on ne le croit — et ce n'est pas une question d'intelligence.","secs":[{"t":"b","v":"L'argent est un sujet que personne n'apprend vraiment. Ni à l'école, ni en famille. On grandit avec des mots qu'on ne comprend pas — assurance vie, PEA, taux d'intérêt — et une impression vague qu'on aurait dû les apprendre quelque part."},{"t":"b","v":"Cette ignorance crée de l'anxiété. Et l'anxiété crée de l'évitement. Ce cercle se brise très bien dès qu'on commence à mettre des mots simples sur des concepts qui semblaient complexes."},{"t":"e","title":"Un exemple concret","v":"Camille gagne 1 800 € par mois et a un Livret A. Elle gère au sens où les fins de mois passent. Mais si on lui demande ce que rapporte son Livret A, elle ne sait pas répondre. Camille n'est pas mauvaise gestionnaire — elle manque simplement d'informations."},{"t":"r","v":"Se sentir perdu avec l'argent est normal. Ça ne dit rien de ton intelligence — ça dit que personne ne t'a encore expliqué les bases clairement."},{"t":"b","v":"La plupart des personnes qui semblent à l'aise avec l'argent ne l'ont pas appris seules. Elles ont eu accès à des informations et à un environnement qui a normalisé ces sujets."},{"t":"c","v":"\"Comprendre l'argent, ce n'est pas devenir expert. C'est avoir assez d'informations pour ne plus se sentir dépassé.\""}],"q":{"text":"Comment tu te sens face aux sujets d'argent ?","opts":["Plutôt à l'aise","Un peu perdu(e)","Vraiment anxieux(se)"],"hints":["Ce parcours va renforcer ta confiance encore plus.","C'est normal et courant. Ce parcours est fait pour toi.","Comprendre ensemble va changer ça rapidement."],"ctas":["Approfondir ma compréhension","Voir ce que ça implique pour moi","Commencer à démystifier"]},"cta":"Voir ce que ça implique pour moi","nxt":"a01","ntitle":"Est-ce que je gère bien mon argent ?","isPremium":false},"a01":{"mod":"Module 0","modId":"m0","ch":"2 / 4","title":"Est-ce que je gère bien mon argent ?","tag":"Fondamentaux","tb":"#FEF3C7","tc":"#92400E","min":4,"acc":"Bien gérer son argent est une expression qui fait peur. Elle sous-entend qu'il y a une bonne réponse — et qu'on la rate peut-être.","secs":[{"t":"b","v":"Il n'existe pas de profil parfait. Certains épargnent beaucoup mais n'investissent rien. D'autres dépensent tout mais vivent selon leurs valeurs. Aucun profil n'est correct en soi."},{"t":"b","v":"Ce qui compte vraiment, c'est de savoir où on en est. Pas pour se juger — pour comprendre. Un médecin qui diagnostique ne juge pas : il constate pour pouvoir agir."},{"t":"e","title":"Trois profils courants","v":"Profil Sécurité : épargne régulièrement, évite tout risque. Résultat : tranquille mais l'argent ne travaille pas.\n\nProfil Instinctif : dépense selon les envies, pas de budget. Surprises parfois en fin de mois.\n\nProfil Évitant : ne regarde pas ses comptes. Fonctionne jusqu'au jour où ça ne fonctionne plus."},{"t":"r","v":"Il n'y a pas de bonne façon de gérer son argent — mais il y a une différence entre gérer consciemment et gérer par défaut."},{"t":"b","v":"Ce qui change vraiment la donne, c'est de passer d'une gestion subie à une gestion choisie."},{"t":"c","v":"\"Gérer son argent consciemment, ce n'est pas être avare. C'est savoir ce qu'on fait de sa liberté financière.\""}],"q":{"text":"Comment tu décrirais ta façon de gérer ton argent ?","opts":["Je suis organisé(e)","Je fais au feeling","Je préfère ne pas y penser"],"hints":["Super point de départ pour aller encore plus loin.","L'intuition peut suffire jusqu'à un certain point.","Comprendre d'abord, puis agir — c'est ce que ce parcours propose."],"ctas":["Optimiser ma gestion","Voir ce que ça implique pour moi","Commencer par comprendre"]},"cta":"Voir ce que ça implique pour moi","nxt":"a02","ntitle":"Les erreurs financières les plus fréquentes","isPremium":false},"a02":{"mod":"Module 0","modId":"m0","ch":"3 / 4","title":"Les erreurs financières les plus fréquentes","tag":"Fondamentaux","tb":"#FEF3C7","tc":"#92400E","min":5,"acc":"La plupart des erreurs financières ne viennent pas de mauvaises décisions. Elles viennent d'un manque d'information au bon moment.","secs":[{"t":"b","v":"Il y a des patterns récurrents dans la façon dont les gens se retrouvent dans des situations difficiles. Ces erreurs sont liées à l'absence d'information financière de base, pas au niveau de revenu."},{"t":"k","v":"68 %","lbl":"des Français n'ont pas d'épargne de sécurité suffisante pour tenir 3 mois sans revenus"},{"t":"e","title":"Les 5 erreurs les plus fréquentes","v":"1. Garder tout son argent sur le compte courant\n2. Ne pas avoir d'épargne de précaution\n3. Payer trop d'intérêts sur des crédits sans le savoir\n4. Ne pas comparer avant de souscrire\n5. Attendre le bon moment pour commencer à épargner ou investir"},{"t":"r","v":"Ces erreurs sont normales — la plupart des gens les font. Les reconnaître, c'est déjà commencer à les éviter."},{"t":"b","v":"Aucune de ces erreurs n'est irréversible. Certaines sont plus faciles à corriger qu'on ne le croit."},{"t":"c","v":"\"Ce n'est pas ce qu'on ne sait pas qui pose problème. C'est ce qu'on ne sait pas qu'on ne sait pas.\""}],"q":{"text":"Tu te reconnais dans l'une de ces erreurs ?","opts":["Oui, clairement","Un peu","Non, je pense les éviter"],"hints":["Pas de panique — les reconnaître c'est les corriger à moitié.","C'est souvent inconscient. Ce parcours va t'aider.","C'est une bonne base. On va aller encore plus loin."],"ctas":["Voir ce que ça implique pour moi","Identifier mes angles morts","Consolider mes bonnes pratiques"]},"cta":"Voir ce que ça implique pour moi","nxt":"a03","ntitle":"Faire le point sur ma situation aujourd'hui","isPremium":false},"a03":{"mod":"Module 0","modId":"m0","ch":"4 / 4","title":"Faire le point sur ma situation aujourd'hui","tag":"Fondamentaux","tb":"#FEF3C7","tc":"#92400E","min":5,"acc":"Avant de faire quoi que ce soit, il y a une étape souvent négligée : comprendre vraiment d'où on part.","secs":[{"t":"b","v":"Faire le point sur sa situation financière, c'est répondre à trois questions : Combien j'ai ? Combien j'ai chaque mois ? Combien je dépense ?"},{"t":"b","v":"Ces questions semblent simples. Mais peu de gens peuvent y répondre précisément sans réfléchir. Et c'est là que se trouvent les premières marges de manoeuvre."},{"t":"e","title":"Une façon simple de faire le point","v":"Revenus mensuels nets : _______ €\nCharges fixes (loyer, crédits…) : _______ €\nVie courante (courses, transport…) : _______ €\nLoisirs et plaisirs : _______ €\n\nReste disponible : _______ €\n\nSi positif → il y a une capacité d'épargne.\nSi nul ou négatif → comprendre où va l'argent est prioritaire."},{"t":"r","v":"Le point de départ le plus honnête est souvent inconfortable. Mais c'est aussi le plus utile."},{"t":"b","v":"Beaucoup de personnes évitent de regarder leurs comptes parce qu'elles ont peur de ce qu'elles vont y trouver. Mais ne pas regarder ne change pas la réalité."},{"t":"c","v":"\"On ne peut pas améliorer ce qu'on ne mesure pas. Et mesurer, ce n'est pas se juger — c'est se donner les moyens d'agir.\""}],"q":{"text":"Globalement, à la fin du mois, il te reste...","opts":["Quelque chose à mettre de côté","Presque rien","Ça varie beaucoup"],"hints":["Parfait. Voyons comment optimiser cette capacité d'épargne.","Il y a probablement des leviers à identifier.","La variabilité signale souvent des choses à mieux comprendre."],"ctas":["Voir ce que ça implique pour moi","Voir comment optimiser","Mieux comprendre ma situation"]},"cta":"Analyser ma situation concrètement","nxt":"a10","ntitle":"C'est quoi investir concrètement","isPremium":false},"a10":{"mod":"Module 1","modId":"m1","ch":"1 / 4","title":"C'est quoi investir concrètement","tag":"Fondamentaux","tb":"#FEF3C7","tc":"#92400E","min":4,"acc":"Investir fait peur. Le mot évoque la bourse, les risques, les experts en costume. En réalité, c'est beaucoup plus simple et beaucoup plus accessible qu'on ne le croit.","secs":[{"t":"b","v":"Investir, dans sa forme la plus simple, c'est mettre son argent dans quelque chose qui peut produire plus d'argent. Contrairement à une dépense, un investissement le fait travailler."},{"t":"b","v":"Il existe mille façons d'investir. Déposer de l'argent sur un Livret A, c'est un investissement. Acheter un appartement pour le louer, c'est un investissement. Acheter des actions en bourse, c'est un investissement."},{"t":"e","title":"Un exemple très simple","v":"Tu as 1 000 €.\n\nOption A → Compte courant : dans 10 ans, toujours ~1 000 € (valeur réelle diminuée par l'inflation).\n\nOption B → Livret A à 1,5 % : dans 10 ans, ~1 161 €.\n\nOption C → Produit à 5 % en moyenne : dans 10 ans, ~1 629 €.\n\nLe risque augmente de A à C. Le rendement potentiel aussi."},{"t":"r","v":"Investir, c'est choisir de faire travailler son argent. Le niveau de risque est un choix — pas une obligation."},{"t":"b","v":"On peut investir avec 50 € par mois. Le risque ne s'impose pas — il se gère et se choisit."},{"t":"c","v":"\"Investir n'est pas réservé aux experts ou aux riches. C'est un outil qui se comprend et s'utilise à son propre rythme.\""}],"q":{"text":"Quand tu penses à investir, qu'est-ce qui te vient en tête ?","opts":["La bourse / les risques","Quelque chose pour les riches","Quelque chose que je veux comprendre"],"hints":["Il y a du risque, oui — mais il se choisit et se gère.","On peut investir avec 50 € par mois. C'est vraiment pour tout le monde.","Parfait — c'est exactement l'état d'esprit pour avancer."],"ctas":["Comprendre comment gérer le risque","Voir par où commencer","Voir ce que ça implique pour moi"]},"cta":"Voir ce que ça implique pour moi","nxt":"a11","ntitle":"Pourquoi laisser son argent dormir pose un problème","isPremium":false},"a11":{"mod":"Module 1","modId":"m1","ch":"2 / 4","title":"Pourquoi laisser son argent dormir pose un problème","tag":"Épargne","tb":"#EEF2FF","tc":"#1E3A8A","min":5,"acc":"Beaucoup de personnes laissent leur argent sur leur compte courant sans vraiment savoir pourquoi. Par habitude, par confort, ou par peur de faire une erreur.","secs":[{"t":"k","v":"2,1 %","lbl":"Inflation moyenne annuelle en France sur 10 ans\nTon argent qui dort perd cette valeur chaque année"},{"t":"b","v":"Si tu as 10 000 € sur un compte courant pendant 5 ans, leur pouvoir d'achat réel diminue d'environ 10 %. Ce n'est pas de l'argent perdu visible — mais c'est une érosion silencieuse et continue."},{"t":"h","v":"Le coût de l'inaction : une illustration"},{"t":"e","title":"10 000 € gardés 5 ans","v":"→ Sur compte courant (0 %) : 10 000 € mais pouvoir d'achat ≈ 9 000 €\n→ Sur Livret A (1,5 %/an) : 10 778 € → pouvoir d'achat ≈ 9 700 €\n→ Différence de comportement : +700 € de valeur préservée"},{"t":"r","v":"L'inflation ne s'arrête jamais. Chaque année sans action, ton argent vaut un peu moins en pouvoir d'achat réel. Le Livret A ne compense pas toujours, mais c'est mieux que rien."},{"t":"h","v":"Pourquoi la plupart des gens ne bougent pas"},{"t":"b","v":"Le biais du statu quo est très fort en finance personnelle. On préfère inconsciemment ne rien faire plutôt que de prendre une décision imparfaite. Mais l'inaction est elle-même une décision — qui a un coût réel."},{"t":"warn","title":"Ce que cet article ne dit pas","v":"Cet article ne te recommande pas de placer ton argent quelque part. Il t'aide à comprendre pourquoi l'inaction a un coût. Toute décision de placement doit être adaptée à ta situation personnelle."}],"q":{"text":"Ton argent est placé aujourd'hui ?","opts":["Oui","Non","Un peu"],"hints":["Bien. Voyons si c'est suffisamment placé par rapport à ta situation.","C'est le bon moment pour comprendre ce que ça implique concrètement.","Un premier pas. Voyons ce que ça donne réellement pour toi."],"ctas":["Voir si mon épargne est bien placée","Voir ce que ça implique pour moi","Comprendre ce que je peux améliorer"]},"cta":"Voir ce que ça implique pour moi","nxt":"a12","ntitle":"L'inflation : ce que ça change vraiment","isPremium":false},"a12":{"mod":"Module 1","modId":"m1","ch":"3 / 4","title":"L'inflation : ce que ça change vraiment","tag":"Fondamentaux","tb":"#FEF3C7","tc":"#92400E","min":6,"acc":"On entend inflation partout. Mais ce que ça change concrètement, dans la vie de tous les jours, est rarement expliqué simplement.","secs":[{"t":"k","v":"1,7 %","lbl":"Inflation en France — mars 2026 (INSEE)\nRebond après le choc pétrolier du Moyen-Orient"},{"t":"b","v":"L'inflation, c'est la hausse générale et durable des prix. Quand l'inflation est de 2 %, un panier de courses qui coûtait 100 € en vaut 102 € un an plus tard. En apparence anodin — sur 10 ans, c'est +22 %."},{"t":"h","v":"Comment l'inflation est-elle mesurée ?"},{"t":"b","v":"L'INSEE calcule chaque mois un indice de prix sur un panier représentatif (alimentation, énergie, logement, services...). La variation sur 12 mois donne l'inflation. En mars 2026, l'énergie a grimpé de +7,3 % sous l'effet des tensions géopolitiques."},{"t":"e","title":"Impact sur 10 000 € d'épargne","v":"Inflation à 1,7 %/an sur 5 ans :\n→ Pouvoir d'achat réel de 10 000 € ≈ 9 190 €\n→ Perte de valeur ≈ 810 €\n\nAvec Livret A à 1,5 % :\n→ Capital après 5 ans ≈ 10 778 €\n→ En termes réels ≈ 9 911 € (rendement réel négatif de -0,2 %)"},{"t":"r","v":"Depuis fév. 2026, le rendement réel du Livret A est légèrement négatif (1,5 % - 1,7 % = -0,2 %). C'est une première depuis 2024. Cela ne signifie pas qu'il faut éviter le Livret A — mais qu'il ne suffit pas seul pour conserver son pouvoir d'achat."},{"t":"warn","title":"Ce que l'inflation ne capture pas","v":"L'inflation est une moyenne. Selon ton mode de vie, ton inflation personnelle peut être très différente. Si tu loues à Paris et fais tes courses en bio, ton inflation réelle est probablement plus élevée que l'indice INSEE."}],"q":{"text":"Savais-tu que l'inflation impactait la valeur de ton épargne ?","opts":["Oui, je le savais","Vaguement","Non, c'est nouveau pour moi"],"hints":["Ce module va te donner les outils pour agir en conséquence.","C'est souvent flou jusqu'à ce qu'on voit les chiffres.","Maintenant que tu le sais, tu peux prendre de meilleures décisions."],"ctas":["Voir comment me protéger","Voir ce que ça implique pour moi","Comprendre mes options"]},"cta":"Voir ce que ça implique pour moi","nxt":"a13","ntitle":"Pourquoi les taux évoluent","isPremium":false},"a13":{"mod":"Module 1","modId":"m1","ch":"4 / 4","title":"Pourquoi les taux évoluent","tag":"Fondamentaux","tb":"#FEF3C7","tc":"#92400E","min":4,"acc":"Le Livret A passe de 3 % à 1,5 %. Les taux des crédits immobiliers doublent. Qu'est-ce qui provoque ces changements ?","secs":[{"t":"b","v":"Les taux d'intérêt sont un outil de politique économique, fixés ou influencés par les banques centrales — en Europe, la BCE. Quand l'inflation est forte, la BCE augmente ses taux directeurs pour freiner l'activité économique."},{"t":"b","v":"Ces décisions se répercutent partout : sur les taux des crédits immobiliers, sur les rendements des livrets réglementés. C'est pour ça que le Livret A était à 3 % quand l'inflation était forte, et redescend maintenant."},{"t":"e","title":"La chaîne de transmission","v":"BCE augmente ses taux → Les banques empruntent plus cher → Elles prêtent plus cher → Les crédits immobiliers coûtent plus cher → Moins de gens achètent → La demande baisse → Les prix se stabilisent.\n\nParallèlement : les livrets réglementés offrent de meilleurs rendements quand les taux montent."},{"t":"r","v":"Les taux évoluent en réponse à l'inflation et à la santé économique. Comprendre cette logique permet de mieux anticiper comment ça affecte ton épargne."},{"t":"b","v":"Tu n'as pas besoin de comprendre la politique monétaire dans le détail. Savoir que les taux bougent, pourquoi, et ce que ça implique pour toi — c'est déjà beaucoup."},{"t":"c","v":"\"Les taux ne sont pas des caprices. Ce sont des réponses à une réalité économique. Les comprendre, c'est ne plus subir leurs effets à l'aveugle.\""}],"q":{"text":"Est-ce que tu suis l'évolution des taux du Livret A ?","opts":["Oui, régulièrement","Quand j'en entends parler","Non, pas vraiment"],"hints":["Ce module va enrichir ta lecture de l'actualité financière.","C'est souvent comme ça qu'on s'informe.","Pas besoin de suivre l'actu en permanence — comprendre les mécanismes suffit."],"ctas":["Voir ce que les taux actuels impliquent","Voir ce que ça implique pour moi","Commencer à comprendre"]},"cta":"Voir ce que ça implique pour moi","nxt":"a20","ntitle":"Construire une épargne de sécurité","isPremium":false},"a20":{"mod":"Module 2","modId":"m2","ch":"1 / 4","title":"Construire une épargne de sécurité","tag":"Épargne","tb":"#EEF2FF","tc":"#1E3A8A","min":5,"acc":"Avant de penser à investir — il y a une étape préalable que beaucoup sautent. Et c'est souvent là que les plans déraillent.","secs":[{"t":"b","v":"L'épargne de sécurité, c'est un coussin financier. Une réserve disponible immédiatement en cas d'imprévu — panne de voiture, perte d'emploi, réparation urgente. Sans ce coussin, le moindre imprévu devient une crise."},{"t":"b","v":"Le montant conseillé est généralement l'équivalent de 3 à 6 mois de dépenses fixes. Quelqu'un avec un emploi très stable peut s'en tenir à 3 mois. Quelqu'un à son compte visera plutôt 6 mois."},{"t":"e","title":"Comment calculer son épargne de sécurité","v":"Dépenses fixes mensuelles : loyer + charges + alimentation + crédits = ex. 1 400 €\n\n→ Cible à 3 mois : 4 200 €\n→ Cible à 6 mois : 8 400 €\n\nOù la garder ? Sur un Livret A ou LDDS — disponible à tout moment."},{"t":"r","v":"L'épargne de sécurité n'est pas de l'argent bloqué. C'est de la liberté disponible à tout moment — la fondation de toute stratégie financière saine."},{"t":"c","v":"\"L'épargne de sécurité ne rapporte presque rien. Mais elle évite de perdre beaucoup — et c'est souvent là sa vraie valeur.\""}],"q":{"text":"Tu as une épargne de sécurité en place ?","opts":["Oui, suffisante","Un peu, mais pas assez","Non, pas encore"],"hints":["C'est une excellente base.","C'est déjà bien. Voyons comment la compléter.","Ça se construit étape par étape."],"ctas":["Vérifier que mon coussin est suffisant","Voir comment le compléter","Voir ce que ça implique pour moi"]},"cta":"Voir ce que ça implique pour moi","nxt":"a21","ntitle":"Comprendre où part mon argent","isPremium":false},"a21":{"mod":"Module 2","modId":"m2","ch":"2 / 4","title":"Comprendre où part mon argent","tag":"Budget","tb":"#EEF2FF","tc":"#1E3A8A","min":5,"acc":"Tu travailles, tu gagnes de l'argent, et pourtant il semble toujours partir quelque part. Comprendre où, c'est la première étape pour en reprendre le contrôle.","secs":[{"t":"b","v":"La plupart des gens ont une vision floue de leurs dépenses. Ils savent approximativement ce qu'ils gagnent — mais rarement ce qu'ils dépensent vraiment, et pour quoi."},{"t":"b","v":"La façon la plus simple est de diviser ses dépenses en trois familles : les charges fixes (inévitables et constantes), les charges variables (nécessaires mais ajustables), et les dépenses discrétionnaires (choix de confort ou de plaisir)."},{"t":"e","title":"Un exemple de répartition","v":"Charges fixes (loyer, assurances, crédits) : 900 €\nCharges variables (alimentation, transport) : 500 €\nDépenses discrétionnaires (restaurant, shopping) : 300 €\n\nTotal : 1 700 € / mois\nSi revenus = 2 000 € → reste disponible : 300 €"},{"t":"r","v":"Visualiser ses dépenses par catégorie transforme une impression floue en données concrètes sur lesquelles on peut agir."},{"t":"c","v":"\"Comprendre où part son argent, c'est souvent la première vraie surprise financière — et souvent la plus utile.\""}],"q":{"text":"Tu sais à peu près combien tu dépenses chaque mois ?","opts":["Oui, assez précisément","Environ, pas exactement","Non, vraiment pas"],"hints":["C'est une excellente base.","Ce module va t'aider à gagner en précision.","Pas de problème — c'est exactement pour ça qu'on fait ce travail."],"ctas":["Affiner ma vision de mes dépenses","Voir ce que ça implique pour moi","Commencer à cartographier"]},"cta":"Voir ce que ça implique pour moi","nxt":"a22","ntitle":"Comprendre le crédit et ses implications","isPremium":false},"a22":{"mod":"Module 2","modId":"m2","ch":"3 / 4","title":"Comprendre le crédit et ses implications","tag":"Budget","tb":"#EEF2FF","tc":"#1E3A8A","min":5,"acc":"Le crédit, c'est de l'argent qu'on n'a pas encore, qu'on dépense aujourd'hui, et qu'on rembourse avec des intérêts. Simple en apparence — mais ses implications sont souvent sous-estimées.","secs":[{"t":"b","v":"Il existe plusieurs types de crédits. Le crédit immobilier, le crédit à la consommation, le crédit renouvelable (revolving) souvent le plus coûteux, et le découvert bancaire."},{"t":"b","v":"Un crédit immobilier peut avoir un taux de 3 à 4 %. Un crédit à la consommation peut monter à 10-15 %. Un crédit renouvelable peut atteindre 20 % ou plus. La différence de coût sur la durée totale peut être considérable."},{"t":"e","title":"Ce que coûte vraiment un crédit","v":"Tu empruntes 5 000 € pour financer une voiture.\n\nOption A — Crédit auto à 5 % sur 48 mois :\n→ Intérêts totaux : ~520 €\n\nOption B — Crédit renouvelable à 18 % sur 48 mois :\n→ Intérêts totaux : ~2 056 €\n\nMême montant emprunté. Différence : +1 536 € de coût."},{"t":"r","v":"Le taux d'un crédit n'est pas qu'un chiffre — c'est de l'argent réel que tu vas payer en plus du montant emprunté. Toujours comparer avant de signer."},{"t":"c","v":"\"Un crédit bien choisi est un outil. Un crédit mal choisi est un coût caché qui dure des années.\""}],"q":{"text":"Tu as des crédits en cours ?","opts":["Oui, et je connais leurs taux","Oui, mais je ne sais pas exactement","Non, pas actuellement"],"hints":["Parfait — c'est la base pour optimiser son coût total.","Ce module va t'aider à y voir plus clair.","C'est une bonne position de départ."],"ctas":["Voir si mes crédits sont bien optimisés","Voir ce que ça implique pour moi","Comprendre mes options de financement"]},"cta":"Voir ce que ça implique pour moi","nxt":"a23","ntitle":"Combien je peux vraiment épargner ou investir","isPremium":false},"a23":{"mod":"Module 2","modId":"m2","ch":"4 / 4","title":"Combien je peux vraiment épargner ou investir","tag":"Budget","tb":"#EEF2FF","tc":"#1E3A8A","min":5,"acc":"La question n'est pas 'est-ce que je peux épargner ?' mais 'combien est-ce que je peux réalistement mettre de côté chaque mois ?'","secs":[{"t":"b","v":"Calculer sa capacité d'épargne réelle, c'est faire la différence entre ses revenus et ses dépenses incontournables — puis décider quelle part on choisit de mettre de côté. L'erreur la plus fréquente : épargner ce qui reste en fin de mois."},{"t":"b","v":"Une règle simple pour commencer : la règle 50/30/20. 50 % pour les besoins essentiels, 30 % pour les envies et le confort, 20 % pour l'épargne et l'investissement."},{"t":"e","title":"Application concrète","v":"Revenus mensuels nets : 2 000 €\n\n→ Besoins essentiels : 1 000 €\n→ Confort et plaisir : 600 €\n→ Épargne / investissement : 400 €\n\nCes 400 € peuvent se décomposer :\n→ 200 € sur le Livret A (épargne de sécurité)\n→ 200 € dans un produit d'investissement (long terme)"},{"t":"r","v":"Épargner en premier, pas en dernier. Mettre de côté dès réception du salaire, avant de dépenser, est la méthode la plus efficace."},{"t":"c","v":"\"Ce n'est pas combien tu gagnes qui détermine ta richesse — c'est combien tu gardes, et pendant combien de temps.\""}],"q":{"text":"Tu épargnes plutôt...","opts":["En début de mois (automatique)","Ce qui reste en fin de mois","Rarement ou jamais"],"hints":["C'est la meilleure méthode — l'automatisation est la clé.","Voyons comment passer à l'automatique.","Ce module va t'aider à trouver un montant réaliste pour toi."],"ctas":["Optimiser mon automatisation","Voir ce que ça implique pour moi","Trouver mon montant idéal"]},"cta":"Voir ce que ça implique pour moi","nxt":"a30","ntitle":"À quoi servent les livrets (Livret A, LDDS, LEP...)","isPremium":false},"a30":{"mod":"Module 3","modId":"m3","ch":"1 / 7","title":"À quoi servent les livrets (Livret A, LDDS, LEP...)","tag":"Livrets","tb":"#EEF2FF","tc":"#1E3A8A","min":5,"acc":"Le Livret A, presque tout le monde en a un. Mais peu de personnes savent vraiment à quoi il sert, comment il fonctionne — et s'il est vraiment adapté à leur situation.","secs":[{"t":"k","v":"22 950 €","lbl":"Plafond du Livret A — le livret le plus répandu en France\nDépôts garantis par l'État"},{"t":"h","v":"Les 3 livrets réglementés en 2026"},{"t":"cmp","title":"Comparatif livrets réglementés (taux au 1er fév. 2026)","headers":["Produit","Taux","Plafond","Conditions"],"rows":[["Livret A","1,5 %/an","22 950 €","Accessible à tous"],["LDDS","1,5 %/an","12 000 €","Accessible à tous"],["LEP","2,5 %/an","10 000 €","Sous conditions de revenus"],["Livret Jeune","1,5–2,5 %","1 600 €","12–25 ans seulement"]]},{"t":"r","v":"Le LEP offre le meilleur taux (2,5 %/an) mais est soumis à conditions de revenus. Si tu es éligible, c'est le premier livret à maximaliser avant le Livret A."},{"t":"h","v":"Comment fonctionne l'intérêt sur les livrets ?"},{"t":"b","v":"Les intérêts sont calculés par quinzaines civiles. Un dépôt le 14 janvier génère des intérêts à partir du 15 janvier. Un retrait le 5 mars n'a plus généré d'intérêts depuis le 1er mars. Conséquence pratique : il vaut mieux déposer en début de quinzaine et retirer en fin."},{"t":"e","title":"Simulation Livret A vs LEP sur 5 ans","v":"Dépôt initial : 5 000 € + 200 €/mois\n\nLivret A (1,5 %/an) → environ 17 365 €\nLEP (2,5 %/an) → environ 17 735 €\n\nDifférence LEP : +370 € sur 5 ans\n(hypothèses simplifiées — taux susceptibles d'évoluer)"},{"t":"warn","title":"Ces taux peuvent évoluer","v":"Les taux des livrets réglementés sont révisés tous les 6 mois par le gouvernement. Le taux du Livret A est passé de 3 % (2023) à 2,5 % (2024) puis 1,5 % (fév. 2026). Ces projections sont illustratives."},{"t":"h","v":"En pratique : comment ouvrir un Livret A ?"},{"t":"list","v":["Chaque banque (y compris en ligne) est obligée de te proposer un Livret A — c'est un produit réglementé.","Tu peux en avoir un seul à la fois. Si tu en as plusieurs, tu dois régulariser (la banque te le demandera).","L'ouverture est gratuite, immédiate, et sans conditions de revenus pour le Livret A et le LDDS.","Pour le LEP, il faut fournir ton dernier avis d'imposition pour justifier de ton éligibilité."]},{"t":"warn","title":"Rappel pédagogique","v":"Cet article explique le fonctionnement des livrets réglementés. Il ne constitue pas une recommandation d'ouvrir un produit spécifique. Consultez les conditions de votre établissement bancaire pour toute décision."}],"q":{"text":"Tu as un LEP actuellement ?","opts":["Oui","Non, mais je pense être éligible","Non, je ne suis pas éligible"],"hints":["Parfait — c'est le livret le plus avantageux si tu es éligible.","Les plafonds de revenus sont plus larges qu'on ne le croit.","Pas de problème — le Livret A + LDDS reste une très bonne base."],"ctas":["Voir si mon épargne est bien organisée","Vérifier mon éligibilité au LEP","Voir ce que ça implique pour moi"]},"cta":"Voir ce que ça implique pour moi","nxt":"a31","ntitle":"Comprendre simplement l'assurance vie","isPremium":false},"a31":{"mod":"Module 3","modId":"m3","ch":"2 / 7","title":"Comprendre simplement l'assurance vie","tag":"Épargne","tb":"#EEF2FF","tc":"#1E3A8A","min":5,"acc":"L'assurance vie est le placement préféré des Français. Et pourtant, peu de gens comprennent vraiment ce que c'est — à part que ça donne de l'argent à la mort. C'est bien plus que ça.","secs":[{"t":"b","v":"L'assurance vie est avant tout une enveloppe fiscale — un contenant dans lequel on peut mettre différents types de placements. La fiscalité est avantageuse, surtout après 8 ans. Elle contient deux options : le fonds en euros (sécurisé, capital garanti, rendement ~2-3 %) et les unités de compte (plus risquées, potentiellement plus rémunératrices)."},{"t":"b","v":"La grande force de l'assurance vie : sa fiscalité sur les successions. En cas de décès, les bénéficiaires désignés reçoivent le capital avec une fiscalité très avantageuse — jusqu'à 152 500 € par bénéficiaire sans impôt."},{"t":"e","title":"Ce que ça donne concrètement","v":"Tu ouvres une assurance vie avec 200 €/mois pendant 15 ans.\n\nAvec fonds en euros (2,5 %/an estimé) :\n→ Capital constitué : ~45 000 €\n→ Intérêts générés : ~9 000 €\n\nAprès 8 ans de détention :\n→ Abattement fiscal de 4 600 € (célibataire) ou 9 200 € (couple)\n→ Souvent, les gains sous ces seuils ne sont pas taxés."},{"t":"r","v":"L'assurance vie n'est pas une assurance au sens classique. C'est une enveloppe d'épargne avec des avantages fiscaux importants — utile pour préparer la retraite ou une succession."},{"t":"c","v":"\"L'assurance vie est comme une bonne cave à vin — ce qu'on y met compte, mais c'est surtout le temps qu'on lui laisse qui crée la valeur.\""}],"q":{"text":"Tu as une assurance vie en cours ?","opts":["Oui","Non, mais ça m'intéresse","Non, et je ne sais pas si c'est pour moi"],"hints":["Voyons comment l'optimiser selon ta situation.","C'est souvent judicieux d'en explorer ce produit tôt, même avec un petit montant.","Ce module va t'aider à comprendre si ça correspond à ta situation."],"ctas":["Optimiser mon assurance vie","Voir ce que ça implique pour moi","Comprendre si c'est fait pour moi"]},"cta":"Voir ce que ça implique pour moi","nxt":"a32","ntitle":"Le Plan Épargne en Actions (PEA)","isPremium":false},"a32":{"mod":"Module 3","modId":"m3","ch":"3 / 7","title":"Le Plan Épargne en Actions (PEA)","tag":"Investissement","tb":"#DCFCE7","tc":"#166534","min":5,"acc":"Le PEA est l'enveloppe fiscale préférée des investisseurs français pour accéder à la bourse. Mais qu'est-ce que c'est concrètement, et comment ça fonctionne ?","secs":[{"t":"b","v":"Le Plan d'Épargne en Actions (PEA) est une enveloppe fiscale qui permet d'investir principalement dans des actions européennes — ou dans des ETF qui les répliquent. Son grand avantage : après 5 ans de détention, les gains ne sont plus soumis à l'impôt sur le revenu. Seuls les prélèvements sociaux (18,6 %) s'appliquent."},{"t":"b","v":"Le PEA fonctionne comme un compte en deux parties : un compte espèces (où tu verses l'argent) et un compte-titres (où sont détenus tes investissements). Plafond de versement : 150 000 €. L'argent peut être investi dans des ETF, des actions européennes ou des OPCVM éligibles."},{"t":"e","title":"La fiscalité du PEA en pratique","v":"Tu investis 10 000 € dans un ETF monde via ton PEA. Après 8 ans, ton investissement vaut 18 000 € (gain de 8 000 €).\n\nSi tu avais investi via un compte-titres ordinaire :\n→ Impôt sur le gain (flat tax CTO) : 8 000 × 31,4 % = 2 512 €\n→ Gain net : 5 488 €\n\nVia le PEA (après 5 ans) :\n→ Prélèvements sociaux uniquement : 8 000 × 18,6 % = 1 488 €\n→ Gain net : 6 512 €\n\nDifférence : +9124 € grâce au PEA."},{"t":"r","v":"Le PEA est l'outil idéal pour investir en bourse en France. Son avantage fiscal après 5 ans est significatif — et il est disponible pour tous."},{"t":"b","v":"Le PEA s'ouvre auprès d'une banque ou d'un courtier en ligne. Les courtiers en ligne ont des frais bien inférieurs aux banques traditionnelles, ce qui peut représenter une différence de plusieurs milliers d'euros sur 10 ans."},{"t":"c","v":"\"Le PEA, c'est investir en bourse avec l'État qui t'aide à payer moins d'impôts. Il serait dommage de ne pas en profiter.\""},{"t":"h","v":"Ce qu'il faut savoir avant d'explorer le PEA"},{"t":"list","v":["Le PEA est disponible chez la plupart des banques et des courtiers en ligne.","La date d'ouverture compte pour les 5 ans — même si le compte reste vide, le délai court.","Tu ne peux détenir qu'un seul PEA par personne (ou PEA-PME en complément).","Un retrait avant 5 ans entraîne la clôture automatique du PEA et l'imposition des gains."]},{"t":"warn","title":"Information pédagogique","v":"Les règles du PEA (plafond, fiscalité, univers éligible) peuvent évoluer. Cet article est informatif. Avant toute décision, vérifiez les conditions actuelles sur impots.gouv.fr ou auprès d'un conseiller."}],"q":{"text":"Tu as déjà un PEA ?","opts":["Oui, je l'utilise","Oui, mais je ne sais pas quoi y mettre","Non, pas encore"],"hints":["Parfait — voyons comment l'optimiser.","Ce module va t'aider à choisir quoi y mettre.","Ce module va t'expliquer comment l'ouvrir et par où commencer."],"ctas":["Comprendre le fonctionnement du PEA","Explorer les enveloppes fiscales","Voir le plan personnalisé"]},"cta":"Voir ce que ça implique pour moi","nxt":"a33","ntitle":"Le Compte-Titres Ordinaire (CTO)","isPremium":false},"a33":{"mod":"Module 3","modId":"m3","ch":"4 / 7","title":"Le Compte-Titres Ordinaire (CTO)","tag":"Investissement","tb":"#DCFCE7","tc":"#166534","min":5,"acc":"Le compte-titres est l'enveloppe d'investissement la plus flexible qui existe. Moins connue que le PEA ou l'assurance vie, elle a pourtant des avantages que ces deux-là n'ont pas.","secs":[{"t":"b","v":"Le Compte-Titres Ordinaire (CTO) permet d'investir dans pratiquement n'importe quel actif financier dans le monde — actions américaines, ETF sur les marchés émergents, matières premières. Contrairement au PEA, il n'y a pas de contrainte géographique ni de plafond de versement."},{"t":"b","v":"En revanche, le CTO n'a pas d'avantage fiscal spécifique. Chaque gain réalisé est soumis à la flat tax de 31,4 % depuis 2026 (prélèvement forfaitaire unique : 12,8 % d'impôt sur le revenu + 18,6 % de prélèvements sociaux). Les dividendes sont aussi imposés chaque année."},{"t":"e","title":"Quand le CTO devient intéressant","v":"Le PEA est plafonné à 150 000 € de versements. Si tu as atteint ce plafond, le CTO permet de continuer à investir.\n\nLe PEA est limité aux marchés européens. Si tu veux investir directement dans des actions américaines (Amazon, Apple...) ou des marchés émergents, seul le CTO le permet directement.\n\nL'ordre logique : d'abord le PEA (pour la fiscalité), puis l'assurance vie, puis le CTO (pour la flexibilité sans contrainte)."},{"t":"r","v":"Le CTO n'est pas inférieur au PEA — il est différent. C'est l'outil de ceux qui ont besoin de plus de flexibilité ou qui ont déjà maximisé leurs autres enveloppes."},{"t":"b","v":"Pour un investisseur débutant, le CTO intervient généralement en troisième position, après le PEA et l'assurance vie. Mais il est utile de le connaître pour comprendre le paysage complet."},{"t":"c","v":"\"Le CTO, c'est l'enveloppe sans limites — mais aussi sans cadeaux fiscaux. À utiliser intelligemment, pas par défaut.\""}],"q":{"text":"Tu as déjà un compte-titres ?","opts":["Oui, je l'utilise","Oui, mais il est vide","Non, pas encore"],"hints":["Voyons si tu l'utilises de façon optimale par rapport à tes autres enveloppes.","Un CTO vide, c'est souvent signe qu'on ne sait pas par où commencer.","Ce module va t'expliquer quand ça devient pertinent d'en comprendre ce produit."],"ctas":["Comprendre le CTO","Explorer les enveloppes fiscales","Voir le plan personnalisé"]},"cta":"Voir ce que ça implique pour moi","nxt":"a34","ntitle":"PEA vs Compte-Titre vs Assurance Vie","isPremium":false},"a34":{"mod":"Module 3","modId":"m3","ch":"5 / 7","title":"PEA, Compte-Titres et Assurance Vie : les trois enveloppes expliquées","tag":"Investissement","tb":"#DCFCE7","tc":"#166534","min":6,"acc":"En France, quand on parle d'investir, on parle d'abord d'enveloppe — le contenant qui détermine la fiscalité. PEA, CTO, assurance vie : trois logiques différentes, mais complémentaires.","secs":[{"t":"b","v":"Avant de choisir dans quoi investir, il faut comprendre où investir. En France, l'enveloppe — le contenant — détermine la fiscalité des gains. Trois grandes enveloppes coexistent : le PEA, le compte-titres (CTO) et l'assurance vie."},{"t":"h","v":"La flat tax : comment sont imposés tes gains ?"},{"t":"b","v":"Depuis 2018, les gains du capital (dividendes, plus-values, intérêts) sont soumis par défaut à la flat tax, aussi appelée PFU (Prélèvement Forfaitaire Unique). C'est un taux unique indépendant de ton revenu."},{"t":"cmp","title":"Décomposition de la flat tax en 2026","headers":["Composante","Taux","Détail"],"rows":[["Impôt sur le revenu","12,8 %","Fixe, quel que soit ton revenu"],["Prélèvements sociaux","18,6 %","CSG (10,6 %) + CRDS (0,5 %) + autres"],["TOTAL flat tax","31,4 %","Depuis le 1er janvier 2026"],["Exception AV/PEL","30 %","Ces produits conservent 17,2 % de PS"]]},{"t":"warn","title":"Pourquoi la flat tax a augmenté en 2026 ?","v":"La loi de financement de la Sécurité sociale 2026 a augmenté la CSG de 1,4 point sur les revenus du capital financier. Résultat : les prélèvements sociaux passent de 17,2 % à 18,6 %, portant la flat tax de 30 % à 31,4 %. Exception : l'assurance vie, le PEL et le CEL restent à 30 %."},{"t":"h","v":"Les trois enveloppes en détail"},{"t":"cmp","title":"Comparatif PEA / CTO / Assurance Vie","headers":["","PEA","CTO","Assurance Vie"],"rows":[["Plafond","150 000 €","Aucun","Aucun"],["Univers","Actions EU + ETF éligibles","Tout (monde entier)","Fonds € + UC (ETF, OPCVM)"],["Fiscalité","18,6 % PS seulement après 5 ans","Flat tax 31,4 % (depuis 2026)","30 % après 8 ans + abattement"],["Succession","Classique","Classique","Hors succession jusqu'à 152 500 €"],["Horizon idéal","Long terme (>5 ans)","Flexible","Retraite et transmission"]]},{"t":"e","title":"Illustration : 8 000 € de gains sur 8 000 € investis","v":"Via CTO (flat tax 31,4 %) :\n→ Impôt sur le gain : 8 000 × 31,4 % = 2 512 €\n→ Gain net : 5 488 €\n\nVia PEA après 5 ans (PS 18,6 % seulement) :\n→ Impôt sur le gain : 8 000 × 18,6 % = 1 488 €\n→ Gain net : 6 512 €\n\nDifférence PEA vs CTO : +1 024 € nets conservés\n(exemple illustratif — situation réelle peut varier)"},{"t":"r","v":"L'avantage fiscal du PEA est réel : après 5 ans, tu ne paies que les prélèvements sociaux (18,6 %), contre 31,4 % pour le CTO. Sur 20 ans d'investissement, cette différence peut représenter des dizaines de milliers d'euros."},{"t":"b","v":"Ces trois enveloppes se complètent plutôt qu'elles ne s'opposent. La logique courante : PEA en priorité pour faire courir les 5 ans, assurance vie en parallèle pour la retraite et la succession, CTO pour les actifs non éligibles au PEA."},{"t":"warn","title":"Ce que cet article ne dit pas","v":"Cet article décrit le fonctionnement de ces enveloppes à titre pédagogique. Il ne constitue pas une recommandation d'en utiliser une plutôt qu'une autre. La situation idéale dépend de ton profil, tes objectifs et ton horizon. Consulte un conseiller si nécessaire."},{"t":"c","v":"\"Ces enveloppes ne sont pas des concurrentes — elles ont chacune un rôle. Savoir lequel te permet de les utiliser au bon moment.\""}],"q":{"text":"Tu utilises actuellement combien de ces enveloppes ?","opts":["Toutes les trois","Deux d'entre elles","Une seule ou aucune"],"hints":["Excellent — voyons comment les optimiser ensemble.","Bien — voyons si l'ordre d'utilisation est optimal.","C'est le bon moment de découvrir laquelle ouvrir en premier."],"ctas":["Optimiser ma combinaison d'enveloppes","Voir ce que ça implique pour moi","Choisir par où commencer"]},"cta":"Voir ce que ça implique pour moi","nxt":"a35","ntitle":"L'épargne logement (PEL, CEL)","isPremium":false,"ctas":["Comprendre la fiscalité des enveloppes","Voir ce que ça implique pour moi","Explorer les différences en détail"]},"a35":{"mod":"Module 3","modId":"m3","ch":"6 / 7","title":"L'épargne logement (PEL, CEL) : ce que ça vaut aujourd'hui","tag":"Épargne","tb":"#EEF2FF","tc":"#1E3A8A","min":4,"acc":"Le PEL et le CEL sont des produits d'épargne conçus pour financer un achat immobilier. Mais leurs règles ont beaucoup changé ces dernières années.","secs":[{"t":"b","v":"Le PEL (Plan d'Épargne Logement) est un produit réglementé dont le taux est fixé à l'ouverture et reste garanti. Les nouveaux PEL ouverts depuis janvier 2026 bénéficient d'un taux de 2 %. Le CEL (Compte Épargne Logement) est plus souple : versements et retraits libres. Son taux est à 1 % au 1er fév. 2026."},{"t":"b","v":"Ces produits permettent d'obtenir un droit à prêt — la possibilité d'emprunter à un taux préférentiel pour acheter un bien. Dans un contexte de taux variables, cet avantage peut être plus ou moins pertinent."},{"t":"e","title":"Ce que ça donne concrètement","v":"PEL ouvert en 2026 avec versements de 300 €/mois pendant 4 ans :\n→ Épargne constituée : ~14 400 €\n→ Intérêts (à 2 %) : ~580 €\n→ Prêt PEL possible selon droits acquis\n\nAttention : les PEL ouverts avant 2018 avaient de meilleurs avantages fiscaux. Les nouveaux PEL sont fiscalisés."},{"t":"r","v":"Le PEL est utile pour sécuriser un taux d'épargne garanti sur plusieurs années et comme apport pour un projet immobilier."},{"t":"c","v":"\"Un bon produit financier est un produit adapté à ta situation — pas à la situation d'un voisin ou d'un parent.\""}],"q":{"text":"Tu envisages un achat immobilier dans les prochaines années ?","opts":["Oui, à court terme","Peut-être dans 5-10 ans","Pas pour l'instant"],"hints":["Un PEL peut être un bon outil d'apport — voyons si ça s'adapte à toi.","C'est une bonne horizon pour commencer à y réfléchir.","D'autres produits peuvent être plus adaptés."],"ctas":["Voir comment préparer mon apport","Voir ce que ça implique pour moi","Explorer d'autres options d'épargne"]},"cta":"Voir ce que ça implique pour moi","nxt":"a36","ntitle":"Les produits destinés à la retraite (PER...)","isPremium":false},"a36":{"mod":"Module 3","modId":"m3","ch":"7 / 7","title":"Les produits destinés à la retraite (PER...)","tag":"Retraite","tb":"#DCFCE7","tc":"#166534","min":5,"acc":"La retraite semble loin pour beaucoup. Et pourtant, c'est précisément parce qu'elle semble loin qu'il faut commencer à y réfléchir tôt.","secs":[{"t":"b","v":"Le PER (Plan d'Épargne Retraite) est le produit phare pour préparer sa retraite depuis 2019. Tu verses de l'argent pendant ta vie active, cet argent est investi, et tu le récupères au moment de la retraite — sous forme de rente ou de capital."},{"t":"b","v":"L'avantage fiscal principal : les versements sur un PER sont déductibles du revenu imposable. Plus on paie d'impôts, plus cet avantage est significatif."},{"t":"e","title":"L'avantage fiscal du PER","v":"Tu es dans une tranche marginale d'imposition à 30 %.\nTu verses 3 000 € sur ton PER cette année.\n\n→ Réduction d'impôt : 3 000 × 30 % = 900 €\n→ Ton versement réel net : 2 100 €\n\nEn contrepartie : cet argent est bloqué jusqu'à la retraite (sauf cas exceptionnels)."},{"t":"r","v":"Le PER est particulièrement efficace pour les contribuables soumis à une tranche d'imposition élevée. Plus les impôts sont importants, plus l'avantage est fort."},{"t":"b","v":"Commencer à 30 ans avec 100 €/mois peut produire un capital similaire à commencer à 45 ans avec 300 €/mois. Le temps est l'ingrédient clé."},{"t":"c","v":"\"La retraite n'est pas une question d'âge. C'est une question de temps — et le temps, une fois passé, ne se rattrape pas.\""}],"q":{"text":"Tu as déjà commencé à préparer ta retraite ?","opts":["Oui, j'ai un PER ou similaire","Pas encore, mais j'y pense","La retraite, c'est loin pour moi"],"hints":["C'est une excellente base — voyons comment l'optimiser.","C'est le bon moment pour passer à l'action.","C'est justement parce que c'est loin que c'est le meilleur moment pour commencer."],"ctas":["Optimiser ma préparation retraite","Voir ce que ça implique pour moi","Comprendre l'urgence d'agir tôt"]},"cta":"Voir ce que ça implique pour moi","nxt":"a40","ntitle":"Quand, combien et par où commencer","isPremium":false},"a40":{"mod":"Module 4","modId":"m4","ch":"1 / 6","title":"Quand, combien et par où commencer","tag":"Investissement","tb":"#DCFCE7","tc":"#166534","min":5,"acc":"La question la plus fréquente sur l'investissement n'est pas comment — c'est quand. Et la réponse est presque toujours la même : maintenant vaut mieux que plus tard.","secs":[{"t":"b","v":"Il n'existe pas de bon moment universel pour commencer à investir. Les marchés peuvent monter ou baisser à n'importe quel moment. Essayer de les anticiper est une erreur que même les professionnels font régulièrement."},{"t":"b","v":"Sur le montant : il n'existe pas de seuil minimum. Certaines plateformes permettent d'investir dès 1 €. L'idée est de commencer avec ce qu'on peut, de façon régulière, et d'augmenter progressivement."},{"t":"e","title":"La puissance de commencer tôt","v":"Scénario A : commencer à 25 ans avec 100 €/mois. Rendement estimé : 7 %/an.\n→ À 65 ans : ~262 000 €\n\nScénario B : commencer à 35 ans avec 200 €/mois. Rendement estimé : 7 %/an.\n→ À 65 ans : ~243 000 €\n\nLe scénario A investit deux fois moins par mois, mais 10 ans plus tôt — et produit plus. C'est la puissance des intérêts composés."},{"t":"r","v":"Le meilleur moment pour commencer à investir, c'était hier. Le deuxième meilleur moment, c'est aujourd'hui."},{"t":"b","v":"Par où commencer ? La plupart des experts s'accordent sur une approche simple : comprendre le PEA, y investir dans des ETF diversifiés, de façon régulière et sans chercher à timer le marché."},{"t":"c","v":"\"Investir, c'est planter des arbres dont on profitera plus tard. On ne les plante pas au moment parfait — on les plante.\""},{"t":"h","v":"Les questions à se poser avant de commencer"},{"t":"list","v":["Ai-je une épargne de sécurité (3–6 mois de dépenses) ? Si non, c'est la priorité absolue avant tout placement risqué.","Mon horizon est-il suffisamment long ? En dessous de 5 ans, les placements volatils (actions, ETF) ne sont généralement pas recommandés.","Est-ce que je comprends ce dans quoi je m'apprête à placer ? L'article suivant approfondit les différents produits.","Suis-je psychologiquement à l'aise avec la volatilité ? Une perte temporaire de 20 % doit être acceptable."]}],"q":{"text":"Qu'est-ce qui t'empêche de commencer à investir ?","opts":["Je ne savais pas comment","J'ai peur de perdre","Je pense que ce n'est pas pour moi"],"hints":["Ce module va justement t'expliquer comment, concrètement.","Comprendre le risque aide à mieux le gérer.","Investir est vraiment pour tout le monde."],"ctas":["Voir comment commencer concrètement","Comprendre comment gérer le risque","Voir ce que ça implique pour moi"]},"cta":"Voir ce que ça implique pour moi","nxt":"a41","ntitle":"Comprendre les risques simplement","isPremium":false},"a41":{"mod":"Module 4","modId":"m4","ch":"2 / 6","title":"Comprendre les risques simplement","tag":"Investissement","tb":"#DCFCE7","tc":"#166534","min":5,"acc":"Le risque fait peur. C'est normal — personne ne veut perdre de l'argent. Mais ne pas comprendre le risque, c'est souvent prendre plus de risques qu'on ne le croit.","secs":[{"t":"b","v":"Il existe plusieurs types de risques. Le risque de perte en capital (la valeur peut baisser). Le risque de liquidité (ne pas pouvoir récupérer son argent quand on en a besoin). Et le risque de concentration (avoir tout dans un seul panier)."},{"t":"b","v":"Ce qui est fondamental : le risque et le rendement sont liés. Pour obtenir plus de rendement potentiel, on accepte plus de risque potentiel. Il n'existe pas d'investissement à rendement élevé et sans risque."},{"t":"e","title":"Le spectre du risque","v":"Risque très faible : Livret A, LDDS, LEP → Rendement ~1,5 à 2,5 %\n\nRisque faible : Fonds en euros assurance vie → Rendement ~2-3 %\n\nRisque modéré : ETF diversifiés → Rendement historique ~7 %/an en moyenne\n\nRisque élevé : Actions individuelles → Rendement très variable\n\nRisque très élevé : Cryptomonnaies → Peut multiplier ou diviser par 10"},{"t":"warn","title":"Crypto : risque très élevé","v":"Les cryptomonnaies sont des actifs extrêmement volatils et spéculatifs, non régulés dans la plupart des pays. Leur valeur peut chuter de plus de 80 % en quelques mois. Elles ne constituent pas un placement approprié pour débuter ou pour de l'épargne que tu ne peux pas te permettre de perdre."},{"t":"r","v":"Le risque zéro n'existe pas — même garder son argent sur un compte courant est risqué (inflation). La question n'est pas d'éviter le risque, c'est de choisir lequel on accepte."},{"t":"b","v":"Le risque se gère principalement de deux façons : la diversification (ne pas mettre tous ses oeufs dans le même panier) et le temps (plus l'horizon est long, plus les fluctuations se lissent)."},{"t":"c","v":"\"Comprendre le risque, c'est comprendre qu'il y a une différence entre se sentir en sécurité et l'être vraiment.\""}],"q":{"text":"Comment tu te positionnes face au risque ?","opts":["Je veux éviter toute perte possible","J'accepte un peu de risque pour un meilleur rendement","Je suis prêt(e) à prendre plus de risque"],"hints":["C'est une position valide — nous allons voir les meilleures options.","C'est souvent la meilleure approche. Voyons comment calibrer ça.","C'est cohérent sur long terme. Voyons comment structurer ça."],"ctas":["Explorer les produits à capital garanti","Calibrer mon niveau de risque","Voir ce que ça implique pour moi"]},"cta":"Voir ce que ça implique pour moi","nxt":"a42","ntitle":"Court terme vs long terme","isPremium":false},"a42":{"mod":"Module 4","modId":"m4","ch":"3 / 6","title":"Court terme vs long terme","tag":"Investissement","tb":"#DCFCE7","tc":"#166534","min":4,"acc":"L'horizon de temps est l'un des facteurs les plus importants dans n'importe quel choix financier. Et c'est aussi l'un des moins souvent pris en compte.","secs":[{"t":"b","v":"L'horizon de placement, c'est la durée pendant laquelle tu peux laisser ton argent investi sans en avoir besoin. Cette durée change tout — le type de produit approprié, le niveau de risque acceptable, et les rendements potentiels."},{"t":"b","v":"Pour un argent dont tu auras besoin dans moins de 2 ans : les placements sécurisés sont à privilégier (Livret A, fonds en euros). Pour un argent dont tu n'auras pas besoin pendant 10 ans ou plus : les ETF actions deviennent pertinents."},{"t":"e","title":"Deux projets, deux approches","v":"Projet A : acheter une voiture dans 2 ans. Budget visé : 8 000 €.\n→ Recommandé : Livret A ou compte à terme. Pas de risque de perte.\n\nProjet B : préparer un complément de retraite dans 20 ans.\n→ Recommandé : investir progressivement en ETF diversifiés.\n\nMettre l'argent du projet A en bourse serait risqué.\nMettre l'argent du projet B uniquement en livret serait sous-optimal."},{"t":"r","v":"L'erreur classique : placer de l'argent dont on aura besoin bientôt dans des produits volatils, ou ne jamais prendre de risque avec de l'argent qu'on n'utilisera que dans 20 ans."},{"t":"b","v":"La segmentation par horizon de temps est l'une des pratiques les plus simples et les plus efficaces. Avoir trois pots : sécurité, moyen terme (2-5 ans), long terme (10 ans+)."},{"t":"c","v":"\"Le temps, en finance, est l'ingrédient secret. Il transforme un risque à court terme en opportunité à long terme.\""}],"q":{"text":"Pour quel horizon tu penses à investir principalement ?","opts":["Moins de 2 ans","2 à 10 ans","Plus de 10 ans"],"hints":["Les livrets et fonds en euros sont tes meilleurs amis pour cet horizon.","Un bon mix entre sécurité et un peu de croissance.","Tu as le temps de ton côté — c'est le meilleur actif en investissement."],"ctas":["Voir les produits adaptés à mon horizon","Trouver le bon mix","Voir ce que ça implique pour moi"]},"cta":"Voir ce que ça implique pour moi","nxt":"a43","ntitle":"Pourquoi diversifier son argent est essentiel","isPremium":false},"a43":{"mod":"Module 4","modId":"m4","ch":"4 / 6","title":"Pourquoi diversifier son argent est essentiel","tag":"Investissement","tb":"#DCFCE7","tc":"#166534","min":4,"acc":"Ne pas mettre tous ses oeufs dans le même panier. On a tous entendu ce conseil. Mais pourquoi, concrètement ? Et comment ça fonctionne ?","secs":[{"t":"b","v":"La diversification, c'est le fait de répartir ses investissements sur plusieurs actifs différents, afin que la mauvaise performance de l'un soit compensée par la bonne performance des autres."},{"t":"b","v":"Quand on investit dans un ETF qui contient 1 600 entreprises dans 20 pays, le risque est mécaniquement dilué. Certaines entreprises peuvent faire faillite — l'ensemble continue de fonctionner."},{"t":"e","title":"La différence en chiffres","v":"Investissement 1 : 10 000 € dans une seule action technologique.\n→ En 2022, le secteur tech a baissé de -40 %.\n→ Valeur : ~6 000 €. Perte : -4 000 €.\n\nInvestissement 2 : 10 000 € dans un ETF monde (1 600 entreprises).\n→ En 2022, l'ETF MSCI World a baissé de -18 %.\n→ Valeur : ~8 200 €. Perte : -1 800 €.\n\nMême année difficile. Impact très différent selon la diversification."},{"t":"r","v":"La diversification ne supprime pas le risque — elle le répartit. C'est la seule protection gratuite qu'on peut obtenir en investissant."},{"t":"b","v":"Les ETF monde sont souvent présentés comme des outils de diversification efficaces pour les non-professionnels — 1 seul produit, des centaines d'entreprises, des frais très faibles."},{"t":"c","v":"\"Diversifier, c'est accepter de ne jamais être le grand gagnant — pour éviter d'être le grand perdant.\""}],"q":{"text":"Ton épargne est actuellement concentrée ou diversifiée ?","opts":["Concentrée (1-2 produits)","Un peu diversifiée","Je ne sais pas vraiment"],"hints":["La diversification peut réduire ton risque sans forcément réduire ton rendement attendu.","Bien — voyons si des ajustements seraient bénéfiques.","Ce module va t'aider à faire le point."],"ctas":["Voir comment mieux diversifier","Évaluer ma diversification actuelle","Voir ce que ça implique pour moi"]},"cta":"Voir ce que ça implique pour moi","nxt":"a44","ntitle":"Investir en accord avec ses valeurs","isPremium":false},"a44":{"mod":"Module 4","modId":"m4","ch":"5 / 6","title":"Investir en accord avec ses valeurs","tag":"Investissement","tb":"#DCFCE7","tc":"#166534","min":4,"acc":"Est-ce qu'on peut à la fois gagner de l'argent et investir de façon cohérente avec ce en quoi on croit ? Les réponses existent.","secs":[{"t":"b","v":"L'investissement responsable regroupe plusieurs approches. L'ISR (Investissement Socialement Responsable) exclut certains secteurs (armement, tabac, charbon) et sélectionne les entreprises selon des critères environnementaux, sociaux et de gouvernance (ESG)."},{"t":"b","v":"Ces approches ont longtemps été associées à des rendements inférieurs — mais les études récentes nuancent cette idée. Les entreprises qui gèrent bien leurs risques environnementaux tendent à être plus résilientes."},{"t":"e","title":"Ce que ça donne concrètement","v":"Un ETF monde standard : ~1 600 entreprises, tous secteurs confondus. Frais : ~0,12 %/an\n\nUn ETF ISR : ~700 entreprises sélectionnées selon critères ESG. Frais : ~0,20 %/an\n\nPerformances historiques comparables sur longue période.\nDifférence de frais : 0,08 %/an — soit ~8 € par an pour 10 000 € investis."},{"t":"r","v":"Investir selon ses valeurs ne signifie pas sacrifier le rendement. Cela demande simplement de choisir ses produits avec plus de discernement."},{"t":"b","v":"Ce qu'il faut éviter : investir dans un produit labellisé vert sans comprendre ce qu'il contient réellement."},{"t":"c","v":"\"L'argent qu'on investit ne disparaît pas — il finance quelque chose. Savoir quoi, c'est une question que chacun peut se poser.\""}],"q":{"text":"Est-ce que les valeurs de tes investissements t'importent ?","opts":["Oui, c'est important pour moi","Un peu, si le rendement reste bon","Non, le rendement prime"],"hints":["Des options ISR sérieuses existent avec des performances comparables.","C'est une approche raisonnable — les deux ne s'opposent pas forcément.","C'est une position tout à fait valide et cohérente."],"ctas":["Explorer les placements responsables","Voir ce que ça implique pour moi","Comprendre comment trouver le bon équilibre"]},"cta":"Voir ce que ça implique pour moi","nxt":"a45","ntitle":"Et si tu attends trop longtemps pour investir ?","isPremium":false},"a45":{"mod":"Module 4","modId":"m4","ch":"6 / 6","title":"Et si tu attends trop longtemps pour investir ?","tag":"Investissement","tb":"#DCFCE7","tc":"#166534","min":5,"acc":"J'attends d'avoir plus d'argent. J'attends que les marchés se stabilisent. Ces phrases sont familières. Mais leur coût réel est rarement évalué.","secs":[{"t":"b","v":"Attendre le bon moment pour investir, c'est accepter que son argent continue de ne pas travailler. Ce coût d'opportunité est réel — même s'il est invisible."},{"t":"k","v":"10 ans","lbl":"C'est la différence de capital entre quelqu'un qui commence à 25 ans et quelqu'un qui commence à 35 ans, à versements identiques"},{"t":"e","title":"Le coût de l'attente","v":"Hypothèse : 200 €/mois, rendement estimé 7 %/an.\n\nCommencer à 25 ans → capital à 65 ans : ~527 000 €\nCommencer à 30 ans → capital à 65 ans : ~370 000 €\nCommencer à 35 ans → capital à 65 ans : ~257 000 €\n\n→ Chaque décennie d'attente réduit le capital final d'environ 30 à 40 %.\n→ Ces chiffres supposent un rendement constant — non garanti."},{"t":"r","v":"L'attente a un coût financier réel. Ce n'est pas une position neutre — c'est une décision, avec ses conséquences."},{"t":"b","v":"La solution n'est pas d'agir impulsivement. C'est de créer une routine d'investissement automatique — un virement programmé, régulier."},{"t":"c","v":"\"Le seul investissement parfait est celui qu'on fait réellement — pas celui qu'on aurait voulu faire au meilleur moment.\""}],"q":{"text":"Tu as tendance à attendre avant d'agir sur des sujets financiers ?","opts":["Oui, souvent","Parfois","Non, j'agis quand je comprends"],"hints":["Comprendre d'abord, puis agir — c'est exactement ce qu'on fait ici.","Voyons ensemble comment passer plus souvent à l'action.","C'est la bonne approche — ce module va te donner les outils pour continuer."],"ctas":["Voir ce que l'attente me coûte","Voir ce que ça implique pour moi","Structurer mon passage à l'action"]},"cta":"Voir ce que ça implique pour moi","nxt":"a50","ntitle":"La bourse, concrètement, c'est quoi ?","isPremium":false},"a50":{"mod":"Module 5","modId":"m5","ch":"1 / 5","title":"La bourse, concrètement, c'est quoi ?","tag":"Marchés","tb":"#EEF2FF","tc":"#1E3A8A","min":8,"acc":"La bourse évoque des traders qui crient, des écrans rouges et verts. La réalité quotidienne est bien différente — et bien plus simple à comprendre qu'on ne le pense.","secs":[{"t":"b","v":"La bourse est un marché où des acheteurs et des vendeurs échangent des titres financiers. Une action, c'est une part de propriété dans une entreprise cotée. Quand tu achètes une action Microsoft, tu deviens littéralement co-propriétaire d'une infime fraction de Microsoft — avec tous ses produits, brevets, et flux de revenus."},{"t":"e","title":"Une transaction boursière concrète — Microsoft","v":"Microsoft vaut environ 3 000 milliards de dollars en 2024.\nElle émet des millions d'actions à ~420 $.\n\nTu achètes 10 actions à 420 $ → tu investis 4 200 $.\nTu possèdes 0,000003 % de Microsoft.\n\nScénario A : Microsoft lance un produit IA à succès.\n→ L'action passe à 500 $. Tes 10 actions = 5 000 $. Gain : +800 $ (+19 %).\n\nScénario B : Résultats décevants, doutes sur la concurrence.\n→ L'action passe à 350 $. Tes 10 actions = 3 500 $. Perte latente : -700 $."},{"t":"h","v":"Les indices boursiers : CAC 40, S&P 500, qu'est-ce que c'est ?"},{"t":"b","v":"Un indice boursier est un panier d'actions représentatif d'un marché ou d'une économie. Il permet de mesurer la performance globale d'un ensemble d'entreprises, un peu comme un thermomètre de l'économie."},{"t":"cmp","title":"Les principaux indices mondiaux","headers":["Indice","Pays / Zone","Entreprises","Ce qu'il mesure"],"rows":[["CAC 40","France","40 plus grandes","Économie française"],["S&P 500","États-Unis","500 plus grandes","Économie américaine"],["Nasdaq 100","États-Unis","100 tech","Secteur technologique US"],["DAX 40","Allemagne","40 plus grandes","Économie allemande"],["MSCI World","Monde entier","1 600 + entreprises","Économie mondiale"],["Nikkei 225","Japon","225 entreprises","Économie japonaise"]]},{"t":"e","title":"Exemple : le CAC 40 en pratique","v":"Le CAC 40 regroupe des entreprises comme LVMH, Total, Air Liquide, BNP Paribas, Airbus...\n\nQuand on dit « Le CAC 40 a gagné 1,2 % aujourd'hui », cela signifie que la valeur moyenne de ces 40 actions a progressé de 1,2 %.\n\nEn 2024, le CAC 40 a atteint un sommet historique à 8 239 points.\nEn 2009 (crise), il était à 2 519 points.\n→ Soit une multiplication par 3,3 en 15 ans."},{"t":"b","v":"Le S&P 500 est l'indice de référence mondial. Il regroupe les 500 plus grandes entreprises américaines : Apple, Microsoft, Amazon, Alphabet (Google), Meta... Il est souvent utilisé comme proxy de l'économie mondiale car ces entreprises opèrent partout."},{"t":"r","v":"La bourse n'est pas un casino — c'est un marché où s'échangent des parts d'entreprises réelles. La valeur fluctue, mais elle reflète la réalité économique sous-jacente. Sur le long terme, les marchés ont toujours fini par remonter."},{"t":"warn","title":"Court terme vs long terme","v":"Sur une journée, une semaine ou même un an, la bourse peut être très volatile. Sur 10, 20, 30 ans, les grands indices ont historiquement toujours progressé. Ce n'est pas une garantie pour le futur — mais c'est un élément de contexte important."},{"t":"c","v":"\"Comprendre la bourse, c'est comprendre qu'on investit dans des entreprises réelles — pas dans des chiffres abstraits.\""}],"q":{"text":"Quelle image tu avais de la bourse avant ce module ?","opts":["Dangereuse et spéculative","Réservée aux experts","Quelque chose que je voulais comprendre"],"hints":["Elle peut l'être, mais le niveau de risque se choisit.","Elle est accessible à tous — ce module va te le montrer.","Bonne curiosité — la compréhension est la première étape."],"ctas":["Voir comment y accéder en sécurité","Voir ce que ça implique pour moi","Aller plus loin dans la compréhension"]},"cta":"Voir ce que ça implique pour moi","nxt":"a51","ntitle":"Pourquoi les marchés montent et baissent","isPremium":false},"a51":{"mod":"Module 5","modId":"m5","ch":"2 / 5","title":"Pourquoi les marchés montent et baissent","tag":"Marchés","tb":"#EEF2FF","tc":"#1E3A8A","min":5,"acc":"Les marchés montent. Les marchés baissent. Les journaux parlent de krach, de rally, de correction. Pourquoi tout ça se produit — et est-ce vraiment prévisible ?","secs":[{"t":"b","v":"La valeur d'une action est déterminée par ce que les acheteurs sont prêts à payer. Ce prix dépend des résultats réels de l'entreprise, des perspectives futures, des taux d'intérêt, des conditions économiques générales — et des émotions collectives."},{"t":"b","v":"Oui, les émotions. Quand tout le monde veut vendre (panique), les prix s'effondrent. Quand tout le monde veut acheter (euphorie), ils s'envolent."},{"t":"e","title":"Un exemple récent","v":"En 2022, la BCE a fortement remonté ses taux pour lutter contre l'inflation.\n\n→ Le crédit est devenu plus cher → ralentissement économique anticipé.\n→ Les obligations sont devenues plus attractives → ventes d'actions.\n→ Résultat : le CAC 40 a baissé d'environ -9 % sur l'année.\n\nCe n'était pas du hasard — c'était une réponse logique à des décisions de politique monétaire."},{"t":"r","v":"Les marchés ne sont pas aléatoires — mais ils sont complexes et partiellement imprévisibles. Comprendre les grands mécanismes permet d'interpréter les mouvements sans paniquer."},{"t":"b","v":"Pour un investisseur à long terme, les hausses et les baisses à court terme importent peu. Sur 20 à 30 ans, les marchés actions mondiaux ont toujours, historiquement, terminé à la hausse."},{"t":"c","v":"\"Les marchés descendent par les escaliers, et remontent par l'ascenseur — ou l'inverse. Dans les deux cas, le sol finit par arriver.\""}],"q":{"text":"Quand tu vois 'les marchés baissent' dans les actualités, tu ressens quoi ?","opts":["De l'inquiétude","De la curiosité","Rien de particulier, ça fait partie du jeu"],"hints":["C'est une réaction normale — ce module va t'aider à la transformer.","C'est la bonne approche — comprendre avant de réagir.","Excellent état d'esprit — c'est celui des investisseurs qui réussissent."],"ctas":["Voir comment gérer les émotions de marché","Approfondir ma compréhension","Voir ce que ça implique pour moi"]},"cta":"Voir ce que ça implique pour moi","nxt":"a52","ntitle":"Actions vs ETF : comprendre la différence","isPremium":false},"a52":{"mod":"Module 5","modId":"m5","ch":"3 / 5","title":"Actions vs ETF : comprendre la différence","tag":"Marchés","tb":"#EEF2FF","tc":"#1E3A8A","min":5,"acc":"On entend beaucoup parler des ETF ces dernières années. Mais beaucoup de gens ne comprennent pas exactement ce que c'est — ni pourquoi ça a changé la façon d'investir.","secs":[{"t":"b","v":"Une action, c'est une part d'une entreprise spécifique. Si Tesla monte de 20 %, tu gagnes 20 %. Si Tesla chute de 50 %, tu perds 50 %. Un ETF (Exchange Traded Fund) est un panier d'actions. Un ETF qui réplique le MSCI World contient ~1 600 entreprises dans 23 pays."},{"t":"b","v":"Les ETF ont deux avantages principaux : la diversification automatique et les frais très bas (souvent 0,10 à 0,30 % par an). Tu achètes une seule part, mais tu es exposé à des centaines d'entreprises à la fois."},{"t":"e","title":"La différence en pratique","v":"Option A : tu investis 1 000 € dans une seule action.\n→ Si elle fait faillite : tu perds tout.\n→ Si elle monte de 30 % : tu gagnes 300 €.\n\nOption B : tu investis 1 000 € dans un ETF MSCI World (1 600 entreprises).\n→ Si une entreprise fait faillite : impact quasi nul.\n→ Si les marchés montent de 10 % : tu gagnes ~100 €.\n→ Frais annuels : ~1,50 € (à 0,15 % par an)"},{"t":"r","v":"Les ETF permettent d'investir dans des centaines d'entreprises avec un seul produit, des frais très faibles, et une diversification automatique."},{"t":"b","v":"Les ETF ne sont pas parfaits — en cas de baisse globale, ils baissent aussi. Mais pour un investisseur qui ne veut pas analyser des bilans comptables, ils offrent une façon simple et peu coûteuse de participer à la croissance mondiale."},{"t":"c","v":"\"Un ETF monde, c'est parier sur l'économie mondiale dans son ensemble — pas sur une seule entreprise.\""}],"q":{"text":"Tu as déjà entendu parler des ETF avant ?","opts":["Oui et j'en possède","Oui mais je ne sais pas exactement ce que c'est","Non, c'est la première fois"],"hints":["Ce module va t'aider à les optimiser.","Tu as le principal — ce module va clarifier les détails.","Maintenant tu sais l'essentiel — le reste vient naturellement."],"ctas":["Voir comment choisir le bon ETF","Voir ce que ça implique pour moi","Commencer à comprendre les indices"]},"cta":"Voir ce que ça implique pour moi","nxt":"a53","ntitle":"Peut-on perdre de l'argent en bourse ?","isPremium":false},"a53":{"mod":"Module 5","modId":"m5","ch":"4 / 5","title":"Peut-on perdre de l'argent en bourse ?","tag":"Marchés","tb":"#EEF2FF","tc":"#1E3A8A","min":5,"acc":"La réponse courte : oui. Mais la réalité est plus nuancée — et beaucoup dépend de comment, quoi et pendant combien de temps on investit.","secs":[{"t":"b","v":"Il est tout à fait possible de perdre de l'argent en bourse. Mais la distinction importante : une perte latente et une perte réalisée sont deux choses différentes. Une perte latente, c'est quand la valeur a baissé mais qu'on n'a pas vendu — elle peut se transformer en gain avec du temps."},{"t":"b","v":"L'erreur classique de l'investisseur débutant : vendre en panique lors d'une baisse, cristalliser une perte qui aurait pu être récupérée avec du temps."},{"t":"e","title":"Perte latente vs perte réalisée","v":"Tu achètes 10 000 € d'ETF monde en janvier.\nEn mars, après une correction, ton portefeuille vaut 7 500 €.\n\nScénario A : tu paniques et tu vends → perte réalisée de 2 500 €.\n\nScénario B : tu ne fais rien et tu attends → 18 mois plus tard, le portefeuille est à 11 500 €.\n\nMême situation de départ. Comportements différents. Résultats radicalement différents."},{"t":"r","v":"On ne perd vraiment de l'argent en bourse que si on vend à un moment défavorable. Le temps est souvent le meilleur antidote à la perte — mais rien ne garantit que les marchés remontent."},{"t":"b","v":"La question n'est pas 'peut-on perdre ?' mais 'quel risque de perte est-on prêt à accepter, et sur quelle durée ?' C'est une question personnelle — et honnête."},{"t":"c","v":"\"La perte potentielle est la contrepartie du gain potentiel. Il n'existe pas d'investissement qui offre l'un sans l'autre.\""}],"q":{"text":"Si ton portefeuille perdait 20 % de sa valeur en un mois, tu ferais quoi ?","opts":["Je vendrais pour limiter les pertes","J'attendrais que ça remonte","J'en profiterais pour en acheter plus"],"hints":["C'est une réaction compréhensible — mais souvent la moins bonne financièrement.","C'est souvent la meilleure décision — difficile à faire mais payante.","C'est la stratégie des investisseurs les plus disciplinés."],"ctas":["Voir comment gérer la pression émotionnelle","Voir ce que ça implique pour moi","Comprendre le DCA pour lisser les risques"]},"cta":"Voir ce que ça implique pour moi","nxt":"a54","ntitle":"Que se passe-t-il en cas de chute de la bourse ?","isPremium":false},"a54":{"mod":"Module 5","modId":"m5","ch":"5 / 6","title":"Que se passe-t-il en cas de chute de la bourse ?","tag":"Marchés","tb":"#EEF2FF","tc":"#1E3A8A","min":5,"acc":"Et si les marchés s'effondrent ? Cette question hante beaucoup d'investisseurs débutants. Comprendre ce qui se passe vraiment lors d'une crise aide à garder la tête froide.","secs":[{"t":"b","v":"Une chute boursière désigne une baisse rapide et significative des marchés — généralement supérieure à 20 %. L'histoire en compte plusieurs : 1929, 2000 (bulle internet), 2008 (crise financière), 2020 (Covid)."},{"t":"b","v":"Ce qui se passe après un krach : les marchés ont toujours, jusqu'à présent, fini par se redresser. Le krach de 2008 a vu le S&P 500 perdre -57 %. Cinq ans plus tard, il avait entièrement récupéré."},{"t":"e","title":"Les grandes crises et leur récupération","v":"Krach de 2000 (Bulle internet) : -78 % en 3 ans → récupération complète : 7 ans\n\nCrise de 2008 : -57 % → récupération complète : 5 ans\n\nKrach Covid (mars 2020) : -34 % en 1 mois → récupération complète : 5 mois\n\nLeçon : les marchés baissent parfois violemment, mais ils remontent — à condition d'avoir le temps et la patience d'attendre."},{"t":"r","v":"Les krachs boursiers font partie du jeu. Ce qui détermine si on en souffre vraiment, c'est ce qu'on fait pendant et après — pas la baisse elle-même."},{"t":"b","v":"Ce qui protège : la préparation mentale et la structure (avoir une épargne de sécurité en dehors des marchés, pour ne pas être forcé de vendre au mauvais moment)."},{"t":"c","v":"\"Les krachs boursiers font les grandes fortunes — de ceux qui ont la patience d'attendre la reprise.\""}],"q":{"text":"Comment tu réagirais à un krach boursier de -30 % ?","opts":["Je vendrais tout pour limiter les pertes","J'attendrais sans rien faire","J'en profiterais pour investir davantage"],"hints":["C'est humain, mais souvent contre-productif financièrement.","C'est une approche souvent citée par les investisseurs de long terme — difficile à appliquer, mais cohérente avec la gestion du risque.","C'est l'approche documentée de nombreux investisseurs long terme."],"ctas":["Voir comment se préparer mentalement","Voir ce que ça implique pour moi","Comprendre comment profiter des baisses"]},"cta":"Voir ce que ça implique pour moi","nxt":"a55","ntitle":"Investir 1 an ou 20 ans ? La leçon d'Air Liquide","isPremium":false},"a60":{"mod":"Module 6","modId":"m6","ch":"1 / 2","title":"Comprendre l'investissement immobilier","tag":"Immobilier","tb":"#EEF2FF","tc":"#1E3A8A","min":6,"acc":"L'immobilier est souvent présenté comme la valeur refuge par excellence. C'est compréhensible — mais comme tout investissement, il mérite d'être compris dans ses nuances.","secs":[{"t":"b","v":"Il existe plusieurs façons d'investir dans l'immobilier. L'achat direct d'un bien pour le louer. Les SCPI (Sociétés Civiles de Placement Immobilier), qui permettent d'investir sans acheter un bien entier — dès quelques centaines d'euros."},{"t":"b","v":"L'investissement locatif direct a des avantages : un actif tangible, des revenus réguliers (les loyers), et un levier via le crédit. Mais il a des contraintes : la gestion, les impayés possibles, l'illiquidité, et les frais importants à l'entrée."},{"t":"e","title":"Comparaison : immobilier direct vs SCPI","v":"Immobilier locatif direct :\n→ Investissement min. : 50 000 à 200 000 €+\n→ Rendement brut moyen : 3 à 7 %\n→ Gestion : à faire soi-même ou déléguer (frais 7-8 %)\n→ Liquidité : faible (vente en quelques mois minimum)\n\nSCPI :\n→ Investissement min. : quelques centaines d'euros\n→ Rendement moyen : 4 à 5 %/an\n→ Gestion : aucune (externalisée)\n→ Liquidité : moyenne (quelques semaines à mois)"},{"t":"r","v":"L'immobilier n'est pas un investissement passif — même en location, il demande du temps, de l'attention et de l'argent. Les SCPI offrent une alternative plus accessible et moins contraignante."},{"t":"b","v":"Concentrer tout son patrimoine dans l'immobilier revient à manquer de diversification. Un patrimoine équilibré intègre généralement différentes classes d'actifs."},{"t":"c","v":"\"L'immobilier est un excellent investissement — à condition de le comprendre, de le financer intelligemment, et de ne pas en faire la seule pièce de son patrimoine.\""}],"q":{"text":"L'immobilier fait partie de tes projets ?","opts":["Oui, achat de résidence principale","Oui, investissement locatif","Pas prioritairement"],"hints":["C'est souvent la première étape — voyons comment l'optimiser.","C'est un projet concret — voyons comment le structurer.","D'autres classes d'actifs peuvent être plus adaptées."],"ctas":["Voir comment financer un achat","Voir ce que ça implique pour moi","Explorer d'autres façons d'investir"]},"cta":"Voir ce que ça implique pour moi","nxt":"a61","ntitle":"Or et matières premières","isPremium":false},"a61":{"mod":"Module 6","modId":"m6","ch":"2 / 2","title":"Or et matières premières","tag":"Investissement","tb":"#DCFCE7","tc":"#166534","min":4,"acc":"L'or fascine depuis des millénaires. Valeur refuge, protection contre l'inflation, actif éternel — il est souvent présenté comme une évidence. Mais qu'apporte-t-il vraiment dans un portefeuille ?","secs":[{"t":"b","v":"L'or est une matière première avec une particularité : il ne produit rien. Pas de loyers, pas de dividendes, pas d'intérêts. Sa valeur repose uniquement sur la confiance et sur l'offre et la demande. Historiquement, l'or est corrélé négativement aux marchés actions — quand les marchés baissent, l'or tend à monter."},{"t":"b","v":"Les matières premières au sens large (pétrole, cuivre, blé, lithium) ont une logique différente : liées aux cycles économiques, à l'offre mondiale, aux conditions climatiques. Investir dedans est complexe et généralement réservé à des profils avertis."},{"t":"e","title":"Or vs actions sur longue période","v":"Performance de l'or sur 30 ans (1994-2024) : +~500 %\nPerformance du MSCI World sur 30 ans (1994-2024) : +~1 000 %\n\nL'or a protégé contre certaines crises (2008, 2020).\nMais il a aussi longtemps stagné (1980-2000 : quasiment 0 % de rendement).\n\nEn termes de rendement pur sur longue période, les actions ont généralement surperformé l'or."},{"t":"r","v":"L'or peut jouer un rôle de diversification dans un portefeuille — mais ce n'est pas un investissement de croissance. C'est une assurance, pas un moteur de rendement."},{"t":"b","v":"Pour un investisseur débutant, l'or représente rarement une priorité. S
