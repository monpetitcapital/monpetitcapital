a place est souvent discutée comme une diversification de 5 à 10 % maximum."},{"t":"c","v":"\"L'or brille surtout quand tout le reste est sombre. Ce n'est pas pour autant qu'il doit occuper toute la place.\""}],"q":{"text":"Tu as déjà pensé à investir dans l'or ?","opts":["Oui, j'en possède","Oui, mais je ne sais pas comment","Non, ça ne m'attire pas"],"hints":["Voyons comment l'intégrer intelligemment dans ton patrimoine.","Ce module va t'expliquer les différentes façons d'y accéder.","C'est une position valide et raisonnable."],"ctas":["Voir comment intégrer l'or dans mon patrimoine","Voir ce que ça implique pour moi","Explorer d'autres actifs alternatifs"]},"cta":"Voir ce que ça implique pour moi","nxt":"a70","ntitle":"Les enjeux de la retraite","isPremium":false},"a70":{"mod":"Module 7","modId":"m7","ch":"1 / 3","title":"Les enjeux de la retraite","tag":"Retraite","tb":"#DCFCE7","tc":"#166534","min":6,"acc":"La retraite en France est un sujet complexe et souvent anxiogène. Comprendre les grandes logiques permet de mieux anticiper.","secs":[{"t":"b","v":"Le système de retraite français est un système par répartition : les actifs d'aujourd'hui cotisent pour payer les retraites d'aujourd'hui. Ce système est mis sous pression par le vieillissement de la population. Pour la génération des 25-45 ans, la retraite publique représentera probablement moins de 50 à 60 % du dernier salaire."},{"t":"b","v":"L'autre partie doit être constituée individuellement — via l'épargne retraite, l'investissement, l'immobilier. C'est ce qu'on appelle le troisième pilier de la retraite."},{"t":"e","title":"Ce que ça implique concrètement","v":"Exemple : tu gagnes 2 500 € nets. Taux de remplacement de 50 %.\n→ Retraite publique : ~1 250 €/mois.\n\nPour maintenir ton niveau de vie, il faudrait compenser ~1 250 €/mois.\n\nOption : constituer un capital de 300 000 € placé à 5 %/an :\n→ ~15 000 €/an de revenus → ~1 250 €/mois\n\nCombien investir/mois pendant 30 ans à 5 %/an pour atteindre 300 000 € ?\n→ ~360 €/mois."},{"t":"r","v":"La retraite publique ne suffira probablement pas seule pour la génération des 25-45 ans. Préparer un complément est une démarche de prudence, pas de pessimisme."},{"t":"b","v":"Le meilleur moment pour commencer à préparer sa retraite est le plus tôt possible. Les intérêts composés ont besoin de temps pour faire leur effet."},{"t":"c","v":"\"Préparer sa retraite, c'est se faire un cadeau à soi-même dans 30 ans. Plus on commence tôt, plus le cadeau est grand.\""}],"q":{"text":"Tu as commencé à préparer ta retraite ?","opts":["Oui, j'ai des placements dédiés","Pas encore, mais j'y pense","La retraite, c'est loin pour moi"],"hints":["C'est une excellente base — voyons comment l'optimiser.","C'est le bon moment pour passer à l'action.","C'est justement parce que c'est loin que c'est le meilleur moment."],"ctas":["Optimiser ma préparation retraite","Voir ce que ça implique pour moi","Comprendre l'urgence d'agir tôt"]},"cta":"Voir ce que ça implique pour moi","nxt":"a71","ntitle":"Succession et transmission","isPremium":false},"a71":{"mod":"Module 7","modId":"m7","ch":"2 / 3","title":"Succession et transmission","tag":"Retraite","tb":"#DCFCE7","tc":"#166534","min":5,"acc":"La succession est un sujet qu'on évite souvent d'aborder. Pourtant, anticiper la transmission de son patrimoine, c'est protéger ses proches et éviter des situations compliquées.","secs":[{"t":"b","v":"Quand une personne décède, son patrimoine est transmis à ses héritiers selon des règles légales précises — ou selon ses dernières volontés si elles ont été formalisées. Sans anticipation, le droit de la succession s'applique automatiquement."},{"t":"b","v":"Les droits de succession sont calculés sur la valeur du patrimoine transmis. Il existe des abattements : chaque enfant peut recevoir jusqu'à 100 000 € d'un parent sans impôt. Au-delà, un barème progressif s'applique de 5 % à 45 %."},{"t":"e","title":"L'avantage de l'assurance vie en succession","v":"Patrimoine hors assurance vie : 300 000 €\n→ Droits de succession pour un enfant : ~40 000 €\n\nMême patrimoine, dont 150 000 € en assurance vie :\n→ Les 150 000 € sont transmis hors succession (exonérés jusqu'à 152 500 €)\n→ Droits de succession sur les 150 000 € restants : ~10 000 €\n\nDifférence : -30 000 € de droits pour vos héritiers."},{"t":"r","v":"La succession ne concerne pas seulement les personnes âgées ou fortunées. Toute personne qui a un patrimoine peut anticiper sa transmission pour protéger ses proches."},{"t":"b","v":"Un testament, un bénéficiaire d'assurance vie bien choisi, une donation planifiée : ces décisions prennent peu de temps et peuvent éviter beaucoup de complications."},{"t":"c","v":"\"Préparer sa succession, c'est décider à l'avance — plutôt que laisser la loi décider à votre place.\""}],"q":{"text":"Tu as déjà pensé à organiser la transmission de ton patrimoine ?","opts":["Oui, j'ai pris des dispositions","Vaguement, sans agir","Non, c'est encore loin pour moi"],"hints":["C'est une excellente initiative — voyons si tout est bien en ordre.","C'est souvent comme ça que ça commence. Voyons comment passer à l'action.","Ce module va te montrer pourquoi c'est utile même tôt."],"ctas":["Vérifier que tout est bien organisé","Voir par où commencer","Voir ce que ça implique pour moi"]},"cta":"Voir ce que ça implique pour moi","nxt":"a72","ntitle":"Héritage : quoi faire ?","isPremium":false},"a72":{"mod":"Module 7","modId":"m7","ch":"3 / 3","title":"Héritage : quoi faire ?","tag":"Retraite","tb":"#DCFCE7","tc":"#166534","min":5,"acc":"Recevoir un héritage est souvent une situation mêlée d'émotions. C'est aussi une décision financière importante — et une opportunité de bien faire les choses.","secs":[{"t":"b","v":"La première question à se poser quand on hérite n'est pas 'où est-ce que je place ça ?' mais 'est-ce que j'accepte cet héritage ?'. En France, on peut accepter une succession, la refuser, ou l'accepter à concurrence de l'actif net si on craint des dettes cachées."},{"t":"b","v":"Une fois l'héritage accepté, la priorité est de comprendre ce qu'on reçoit : argent liquide, placements financiers, bien immobilier, dettes... Chaque catégorie a ses propres implications fiscales et pratiques."},{"t":"e","title":"Les questions à se poser en ordre logique","v":"1. Est-ce que j'accepte la succession ? (y a-t-il des dettes ?)\n2. Quels éléments je reçois et quelle est leur valeur ?\n3. Y a-t-il des droits de succession à payer ?\n4. Quelle est ma situation financière actuelle ?\n   → Dettes coûteuses → Les rembourser est souvent une priorité à considérer.\n   → Épargne de sécurité insuffisante → La constituer.\n5. Quel est mon horizon de temps pour cet argent ?\n   → Court terme : livrets. Long terme : investissement diversifié."},{"t":"r","v":"Un héritage bien géré est celui qu'on a pris le temps de comprendre. Il vaut mieux attendre 3 mois en plaçant sur un livret que de prendre une mauvaise décision irréversible dans l'urgence."},{"t":"b","v":"Un héritage est souvent une opportunité unique de transformer une situation financière. Bien géré, il peut servir de tremplin."},{"t":"c","v":"\"Un héritage n'est pas une décision à prendre le lendemain. C'est une opportunité qui mérite le respect du temps.\""}],"q":{"text":"Si tu recevais un héritage important aujourd'hui, ta première réaction serait...","opts":["Rembourser des dettes","Investir rapidement","Prendre le temps de réfléchir"],"hints":["C'est souvent la meilleure priorité si les taux sont élevés.","La rapidité peut être coûteuse — voyons comment bien calibrer.","C'est la meilleure approche — la patience est payante en finance."],"ctas":["Voir comment gérer un héritage intelligemment","Voir ce que ça implique pour moi","Comprendre les options disponibles"]},"cta":"Voir ce que ça implique pour moi","nxt":"p10","ntitle":"Comprendre le PEA : le guide complet (Premium)","isPremium":false},"p10":{"mod":"Premium · Module 1","modId":"pm1","ch":"1 / 3","title":"Comprendre et choisir un PEA : le guide complet","tag":"Guide complet","tb":"#FEF3C7","tc":"#92400E","min":6,"acc":"Tu comprends ce qu'est un PEA. Tu sais pourquoi c'est intéressant. Maintenant : comment en ouvrir un concrètement ?","secs":[{"t":"b","v":"Un PEA s'ouvre auprès d'une banque ou d'un courtier en ligne. Le choix du support est important : les frais varient énormément. Les banques traditionnelles ont souvent des frais élevés (0,5 à 1 % par transaction + frais de garde annuels). Les courtiers en ligne proposent des frais bien plus bas — parfois 0 frais de garde et moins de 1 € par transaction."},{"t":"b","v":"Les documents nécessaires sont simples : une pièce d'identité valide, un justificatif de domicile de moins de 3 mois, ton RIB, et ton numéro fiscal (disponible sur ton avis d'imposition)."},{"t":"e","title":"Comparaison de frais sur 10 ans","v":"Investissement : 200 €/mois → 24 000 € investis sur 10 ans\n\nBanque traditionnelle (0,5 % transaction + 50 €/an de garde) :\n→ Frais totaux sur 10 ans : ~1 700 €\n\nCourtier en ligne (0 garde, 0,10 % transaction) :\n→ Frais totaux sur 10 ans : ~400 €\n\nDifférence : -1 300 € de frais → directement dans ta poche."},{"t":"r","v":"Le choix du support où ouvrir ton PEA a un impact direct sur ton rendement final. Les frais, sur 10-20 ans, peuvent représenter des milliers d'euros."},{"t":"b","v":"L'ouverture prend généralement 24 à 48 heures en ligne. Un conseil pratique : ouvrir le PEA même avec un petit montant (50 €, 100 €) pour faire partir le compteur des 5 ans."},{"t":"c","v":"\"L'ouverture d'un PEA prend moins d'une heure en ligne. Le plus difficile est de décider de commencer — le reste est administratif.\""}],"q":{"text":"Tu as une idée de là où tu veux ouvrir ton PEA ?","opts":["Oui, j'ai déjà choisi","J'hésite encore","Non, j'ai besoin d'aide pour choisir"],"hints":["Ce module va te confirmer que ton choix est optimal.","Ce module va t'aider à trancher en fonction de tes critères.","On va identifier ensemble les critères importants pour toi."],"ctas":["Valider mon choix de courtier","Comparer les options","Voir ce que ça implique pour moi"]},"cta":"Voir ce que ça implique pour moi","nxt":"p11","ntitle":"Passer un ordre en bourse","isPremium":true},"p11":{"mod":"Premium · Module 1","modId":"pm1","ch":"2 / 3","title":"Passer un ordre en bourse","tag":"Action concrète","tb":"#FEF3C7","tc":"#92400E","min":5,"acc":"L'idée de passer un ordre en bourse semble intimidante. En pratique, les étapes sont simples.","secs":[{"t":"b","v":"Un ordre en bourse, c'est simplement une instruction donnée à ton courtier. Il existe deux grands types d'ordres. L'ordre au marché : tu achètes ou vends immédiatement, au prix actuel. L'ordre à cours limité : tu fixes un prix maximum à l'achat — contrôle du prix, mais l'ordre peut ne pas s'exécuter."},{"t":"b","v":"Pour débuter, l'ordre au marché sur des ETF très liquides (MSCI World, S&P 500) est la solution la plus simple. Le cours limité est utile quand on veut maîtriser précisément son prix d'entrée."},{"t":"e","title":"Exemple pratique","v":"Tu veux acheter 5 parts d'un ETF MSCI World qui cote 350 €.\n\nOrdre au marché :\n→ Exécuté immédiatement à ~350 €. Tu dépenses ~1 750 €.\n\nOrdre à cours limité à 345 € :\n→ L'ordre est en attente. Si l'ETF descend à 345 €, il s'exécute.\n→ Si ça ne descend jamais, l'ordre expire sans être exécuté."},{"t":"r","v":"Pour débuter, l'ordre au marché sur des ETF très liquides est la solution la plus simple. Le cours limité est utile quand on veut maîtriser précisément son prix d'entrée."},{"t":"b","v":"Le vrai risque quand on passe ses premiers ordres est d'agir sous l'émotion — acheter dans l'euphorie, vendre dans la panique. La technique des ordres est simple ; la discipline émotionnelle est ce qui demande le plus de travail."},{"t":"c","v":"\"Passer un ordre en bourse prend 3 minutes. La décision de ne pas réagir émotionnellement prend une vie entière à maîtriser.\""}],"q":{"text":"Tu as déjà passé un ordre en bourse ?","opts":["Oui, plusieurs fois","Non, mais je veux apprendre","Non, ça me fait encore peur"],"hints":["Ce module va enrichir ta pratique.","Ce module va te guider pas à pas.","C'est normal — la compréhension enlève la peur progressivement."],"ctas":["Optimiser mes passages d'ordres","Voir ce que ça implique pour moi","Comprendre comment me lancer en douceur"]},"cta":"Voir ce que ça implique pour moi","nxt":"p12","ntitle":"Comprendre une interface d'investissement","isPremium":true},"p12":{"mod":"Premium · Module 1","modId":"pm1","ch":"3 / 3","title":"Comprendre une interface d'investissement","tag":"Action concrète","tb":"#FEF3C7","tc":"#92400E","min":5,"acc":"Tu as ouvert un PEA ou un compte sur un courtier en ligne. Face à l'interface, tu ne sais pas trop où regarder. Voyons les éléments clés.","secs":[{"t":"b","v":"La plupart des interfaces de courtiers sont construites autour des mêmes éléments : un tableau de bord (vue d'ensemble de ton portefeuille), un moteur de recherche d'instruments, une fiche produit (graphiques + informations), et un module de passage d'ordres."},{"t":"b","v":"Les indicateurs clés à comprendre : le cours (prix actuel), la variation journalière, le volume d'échange (indicateur de liquidité), et le TER (Total Expense Ratio) pour les ETF — c'est les frais annuels du fonds."},{"t":"e","title":"Décoder une fiche ETF","v":"ETF MSCI World : iShares Core MSCI World UCITS ETF\n\nTicker : IWDA\nPrix actuel : 82,50 €\nVariation jour : +0,35 % (+0,29 €)\nTER (frais annuels) : 0,20 %\nActif sous gestion : 64 milliards $\nNombre d'entreprises : 1 464\n\n→ Pour 1 000 € investis : tu paies 2 € de frais par an.\n→ Diversification automatique sur 1 464 entreprises mondiales."},{"t":"r","v":"Comprendre une interface d'investissement, c'est apprendre à lire 5 à 6 indicateurs clés. Inutile de tout comprendre d'un coup — l'essentiel suffit pour commencer."},{"t":"b","v":"Ce qui compte au départ : savoir chercher un ETF, lire son TER, et passer un ordre simple. Tout le reste vient avec l'expérience."},{"t":"c","v":"\"Une interface d'investissement n'est pas plus complexe qu'une application bancaire. Elle demande juste un peu de familiarisation.\""}],"q":{"text":"Tu es à l'aise avec les interfaces de courtiers ?","opts":["Oui, je les utilise déjà","Un peu, mais j'hésite encore","Non, je me perds facilement"],"hints":["Ce module va t'aider à aller encore plus loin.","C'est normal au début — ça vient avec la pratique.","Après ce module, les éléments clés te sembleront familiers."],"ctas":["Approfondir mes connaissances","Voir ce que ça implique pour moi","Commencer avec les bases"]},"cta":"Voir ce que ça implique pour moi","nxt":"p20","ntitle":"Construire un portefeuille d'investissement","isPremium":true},"p20":{"mod":"Premium · Module 2","modId":"pm2","ch":"1 / 3","title":"Construire un portefeuille d'investissement","tag":"Avancé","tb":"#EEF2FF","tc":"#1E3A8A","min":6,"acc":"Investir dans un seul ETF, c'est déjà bien. Construire un portefeuille, c'est choisir délibérément comment répartir son argent entre différents actifs.","secs":[{"t":"b","v":"Un portefeuille, c'est l'ensemble de ses investissements. La répartition entre classes d'actifs est appelée allocation d'actifs — c'est la décision la plus importante. Elle dépend de trois facteurs : l'horizon de temps, la tolérance au risque, et les objectifs."},{"t":"b","v":"Le portefeuille lazy populaire en France est souvent simple : 80 à 100 % d'ETF monde, avec éventuellement une part d'obligations pour amortir la volatilité."},{"t":"e","title":"Trois profils de portefeuille","v":"Profil prudent (horizon < 5 ans) :\n→ 30 % actions mondiales (ETF MSCI World) | 50 % obligations | 20 % fonds euros\n\nProfil équilibré (horizon 5-15 ans) :\n→ 60 % actions mondiales | 30 % obligations | 10 % immobilier (SCPI)\n\nProfil dynamique (horizon 15+ ans) :\n→ 90-100 % actions mondiales + rééquilibrage annuel"},{"t":"r","v":"Il n'existe pas de portefeuille parfait universel. Le bon portefeuille est celui qu'on peut garder sans paniquer pendant les turbulences."},{"t":"b","v":"Un portefeuille bien construit n'a pas besoin d'être revu tous les jours. Un rééquilibrage annuel suffit généralement."},{"t":"c","v":"\"Le meilleur portefeuille, c'est celui qu'on ne regarde pas tous les matins avec anxiété. La sérénité a une valeur financière réelle.\""}],"q":{"text":"Comment tu décrirais ton profil d'investisseur ?","opts":["Prudent — je préfère la sécurité","Équilibré — je veux un compromis","Dynamique — j'accepte la volatilité"],"hints":["La sécurité est une valeur — voyons comment l'optimiser sans trop sacrifier le rendement.","C'est souvent la meilleure approche pour la plupart des profils.","Ton horizon long terme est ton meilleur atout."],"ctas":["Construire mon portefeuille prudent","Construire mon portefeuille équilibré","Construire mon portefeuille dynamique"]},"cta":"Voir ce que ça implique pour moi","nxt":"p21","ntitle":"Gérer ses émotions face aux marchés","isPremium":true},"p21":{"mod":"Premium · Module 2","modId":"pm2","ch":"2 / 3","title":"Gérer ses émotions face aux marchés","tag":"Avancé","tb":"#EEF2FF","tc":"#1E3A8A","min":5,"acc":"Des études montrent que l'investisseur moyen obtient des rendements bien inférieurs aux marchés — non pas à cause de mauvais choix de produits, mais à cause de ses propres émotions.","secs":[{"t":"b","v":"Le cerveau humain n'est pas câblé pour investir rationnellement. Des biais cognitifs bien documentés interfèrent : l'aversion aux pertes (une perte fait deux fois plus souffrir qu'un gain de même montant procure de plaisir), l'effet de panique, et le biais de récence."},{"t":"b","v":"Ces biais se manifestent surtout lors des krachs (on vend ce qu'on aurait dû garder) et lors des bulles (on achète ce qu'il aurait fallu éviter). La solution n'est pas de supprimer ses émotions — c'est de créer des règles qui empêchent d'agir en fonction d'elles."},{"t":"e","title":"L'investisseur émotionnel vs l'investisseur discipliné","v":"Mars 2020 (krach Covid) : -34 % en un mois.\n\nInvestisseur émotionnel :\n→ Vend son portefeuille en panique. Perte réalisée de -34 %.\n→ Réinvestit 6 mois après, le marché a déjà rebondi de +40 %.\n→ Performance finale : +58 %\n\nInvestisseur discipliné :\n→ Continue d'investir ses 200 €/mois sans s'arrêter.\n→ 5 mois plus tard, marché entièrement récupéré.\n→ Performance finale : +134 %"},{"t":"r","v":"L'ennemi principal de l'investisseur, c'est souvent lui-même. La discipline et les règles préétablies valent souvent plus que la connaissance des marchés."},{"t":"b","v":"La façon la plus efficace de gérer ses émotions en investissement est de ne jamais avoir à les gérer — automatiser les décisions et ne pas regarder son portefeuille trop souvent."},{"t":"c","v":"\"En bourse, le pire ennemi de la performance n'est pas le marché. C'est le miroir.\""}],"q":{"text":"Tu as déjà pris une décision financière sous le coup de l'émotion ?","opts":["Oui, et je le regrette","Peut-être, j'y repense","Non, je suis plutôt rationnel(le)"],"hints":["Reconnaître ses biais est la première étape pour les corriger.","C'est souvent inconscient — ce module va t'aider à identifier les tiens.","C'est une grande force — ce module va t'aider à la consolider."],"ctas":["Voir comment discipliner mes décisions","Voir ce que ça implique pour moi","Mettre en place une routine d'investissement"]},"cta":"Voir ce que ça implique pour moi","nxt":"p22","ntitle":"Les investissements avancés : crypto et Private Equity","isPremium":true},"p22":{"mod":"Premium · Module 2","modId":"pm2","ch":"3 / 3","title":"Les investissements avancés : crypto et Private Equity","tag":"Avancé","tb":"#EEF2FF","tc":"#1E3A8A","min":6,"acc":"Au-delà des actions et des ETF, il existe d'autres classes d'actifs souvent mentionnées — les cryptomonnaies et le Private Equity. Que sont-ils vraiment ?","secs":[{"t":"b","v":"Les cryptomonnaies (Bitcoin, Ethereum...) sont des actifs numériques décentralisés. Ils n'ont pas d'actif sous-jacent, pas de dividendes, pas de garantie. Leur valeur est entièrement spéculative et repose sur l'offre et la demande."},{"t":"b","v":"Le Private Equity (PE) désigne l'investissement dans des entreprises non cotées en bourse. C'est une classe d'actifs historiquement réservée aux institutionnels, avec des rendements potentiels élevés (10-15 %/an pour les meilleurs fonds) et un risque important."},{"t":"e","title":"Ce qu'il faut comprendre","v":"Cryptomonnaies :\n→ Bitcoin : variations de -80 % à +500 % selon les cycles\n→ Fiscalité en France : 31,4 % d'impôt sur les plus-values (flat tax) (flat tax depuis 2026)\n→ Risque majeur : vol, perte de clé, effondrement de valeur\n\nPrivate Equity :\n→ Rendements potentiels historiques : 10 à 15 %/an (meilleurs fonds)\n→ Capital bloqué : 5 à 10 ans en général\n→ Ticket d'entrée : à partir de 1 000 € pour certains fonds accessibles"},{"t":"r","v":"Ces actifs ne sont pas interdits — mais ils nécessitent une base solide avant de les explorer. Comprendre leurs risques spécifiques est indispensable avant d'y allouer de l'argent."},{"t":"b","v":"Dans une logique de patrimoine équilibré, les actifs alternatifs sont souvent envisagés comme une poche satellite — une petite partie (5 à 15 %) du portefeuille global."},{"t":"c","v":"\"Les cryptos et le Private Equity peuvent enrichir un portefeuille — ou l'appauvrir. La différence tient souvent à la compréhension qu'on en a avant d'y entrer.\""}],"q":{"text":"Tu as déjà investi en crypto ou PE ?","opts":["Oui, dans la crypto","Non, mais ça m'intéresse","Non, c'est trop risqué pour moi"],"hints":["Ce module va t'aider à structurer ça intelligemment.","Ce module va te donner les bases pour te lancer avec discernement.","C'est une position valide."],"ctas":["Voir comment intégrer la crypto intelligemment","Voir ce que ça implique pour moi","Explorer d'autres actifs alternatifs"]},"cta":"Voir ce que ça implique pour moi","nxt":"p30","ntitle":"Débuter avec 100 €/mois","isPremium":true},"p30":{"mod":"Premium · Module 3","modId":"pm3","ch":"1 / 4","title":"Débuter avec 100 €/mois","tag":"Cas concret","tb":"#FEF3C7","tc":"#92400E","min":5,"acc":"100 € par mois. Est-ce suffisant pour vraiment investir ? Est-ce que ça vaut le coup de commencer avec si peu ? La réponse est oui — et voilà pourquoi.","secs":[{"t":"b","v":"Beaucoup pensent qu'investir nécessite des sommes importantes. En réalité, les plateformes modernes permettent d'investir dès quelques euros. Et l'effet des intérêts composés fonctionne quel que soit le montant initial. La clé : la régularité."},{"t":"b","v":"100 € par mois, c'est 1 200 € par an. En 20 ans, à un rendement estimé de 7 %/an, c'est environ 52 000 € — alors qu'on n'a investi que 24 000 €. Les 28 000 € restants viennent des intérêts composés."},{"t":"e","title":"Cas concret : Julie, 28 ans","v":"Revenus : 1 900 €/mois nets | Charges : 1 450 €/mois | Reste : 450 €\n\nStratégie adoptée :\n→ 150 € → Livret A (épargne de sécurité)\n→ 100 € → PEA (ETF MSCI World, long terme)\n→ 200 € → dépenses plaisir / imprévus\n\nRésultat après 10 ans :\n→ Livret A : ~18 000 € (épargne sécurité constituée)\n→ PEA : ~17 400 € (dont ~5 400 € d'intérêts)"},{"t":"r","v":"100 € par mois investis régulièrement pendant 20 ans valent bien plus que 1 000 € investis une fois. La régularité bat la taille."},{"t":"b","v":"L'essentiel n'est pas le montant exact. C'est la régularité et le fait de commencer."},{"t":"c","v":"\"100 € par mois, c'est moins d'un café par jour. C'est aussi, sur 20 ans, une différence significative dans ta liberté financière.\""}],"q":{"text":"Tu pourrais mettre de côté 100 € par mois ?","opts":["Oui, sans problème","Peut-être, il faudrait ajuster","Non, ma situation ne le permet pas aujourd'hui"],"hints":["Parfait — ce module va t'aider à structurer ça au mieux.","Voyons ensemble comment dégager ce montant.","Voyons d'abord comment optimiser ta situation actuelle."],"ctas":["Structurer mes 100 €/mois","Voir comment dégager cette capacité","Voir ce que ça implique pour moi"]},"cta":"Voir ce que ça implique pour moi","nxt":"p31","ntitle":"Investir en crypto : ce que ça implique vraiment","isPremium":true},"p31":{"mod":"Premium · Module 3","modId":"pm3","ch":"2 / 4","title":"Investir en crypto : ce que ça implique vraiment","tag":"Cas concret","tb":"#FEF3C7","tc":"#92400E","min":5,"acc":"Partout sur les réseaux sociaux, des histoires de fortunes faites avec le Bitcoin. Et autant d'histoires de personnes qui ont tout perdu. Que se passe-t-il vraiment ?","secs":[{"t":"warn","title":"Risque très élevé — lire avant tout","v":"Les cryptomonnaies sont des actifs non régulés, extrêmement volatils et spéculatifs. Leur valeur peut chuter de 80 à 100 % en peu de temps. Elles ne conviennent pas à la majorité des investisseurs et ne doivent représenter qu'une fraction infime d'un portefeuille, si tant est que ce risque soit accepté et compris. Cet article est strictement pédagogique et ne constitue pas une incitation à investir en crypto."},{"t":"b","v":"La crypto n'est pas un investissement comme les autres. Il n'y a pas d'actif sous-jacent, pas de dividendes, pas de bénéfices d'entreprise à analyser. La valeur repose sur la confiance, l'adoption, et la spéculation."},{"t":"b","v":"La réalité pour la plupart des investisseurs en crypto : ils achètent après des hausses importantes, revendent dans la panique après des baisses, et finissent souvent avec une performance inférieure à ce que le Bitcoin lui-même a produit."},{"t":"e","title":"Ce que les données disent","v":"Bitcoin depuis 2010 : +~60 000 % de rendement total (si acheté tôt et gardé).\n\nMais la volatilité :\n→ 2017 : +2 000 % → -84 % en 2018\n→ 2020 : +300 % → -50 % en 2022\n\nUn investisseur qui a acheté au sommet de 2017 (~20 000 $) a attendu 4 ans pour retrouver son capital initial.\n\nUn investisseur en DCA (100 €/mois sur 5 ans) a généralement mieux performé."},{"t":"r","v":"La crypto peut faire partie d'une stratégie — mais sa volatilité extrême la réserve à ceux qui comprennent ce qu'ils font et peuvent psychologiquement supporter des pertes importantes."},{"t":"b","v":"Si la crypto t'intéresse : n'investir que ce qu'on peut se permettre de perdre entièrement. Ne jamais mettre plus de 5-10 % de son patrimoine."},{"t":"c","v":"\"La crypto, ce n'est pas de l'argent facile. C'est de la volatilité maximale — qui peut aller dans les deux sens.\""}],"q":{"text":"Tu as déjà investi en crypto ou tu y penses ?","opts":["Oui, j'en possède","J'y pense, mais j'hésite","Non, ce n'est pas pour moi"],"hints":["Ce module va t'aider à structurer ça intelligemment.","Ce module va te donner les éléments pour décider en connaissance de cause.","C'est une position parfaitement valide et raisonnable."],"ctas":["Voir comment gérer ma position crypto","Voir ce que ça implique pour moi","Voir pourquoi j'ai peut-être raison d'hésiter"]},"cta":"Voir ce que ça implique pour moi","nxt":"p32","ntitle":"Mettre une grosse somme dans un investissement risqué","isPremium":true},"p32":{"mod":"Premium · Module 3","modId":"pm3","ch":"3 / 4","title":"Mettre une grosse somme dans un investissement risqué","tag":"Cas concret","tb":"#FEF3C7","tc":"#92400E","min":5,"acc":"Tu as économisé 30 000 €, tu as une opportunité devant toi, et tu te demandes si tu devrais tout y mettre. C'est une situation plus fréquente qu'on ne le croit.","secs":[{"t":"b","v":"Concentrer une grosse somme sur un seul investissement risqué est l'une des situations où les erreurs peuvent être les plus coûteuses et les moins réversibles. Les biais cognitifs jouent un rôle important : l'optimisme excessif, le FOMO (peur de rater une opportunité), et l'influence d'une personne de confiance."},{"t":"b","v":"Les questions à se poser avant toute décision : Est-ce que je comprends vraiment ce dans quoi j'investis ? Que se passe-t-il si je perds 50 % ? 100 % ? Est-ce que cette somme peut être reconstruite ?"},{"t":"e","title":"Deux scénarios","v":"Thomas a 40 000 €. Son beau-frère lui propose d'investir tout dans une startup prometteuse.\n\nScénario A — Il investit tout :\n→ La startup échoue (80 % des startups échouent) → perte totale\n→ Thomas repart de zéro à 42 ans\n\nScénario B — Il investit 5 000 € (12,5 % de son capital) :\n→ Si la startup échoue : perte de 5 000 €. Douloureux mais absorbable.\n→ Si la startup réussit (×10) : il gagne 45 000 € sur sa mise de 5 000 €.\n→ Le reste (35 000 €) est investi de façon diversifiée."},{"t":"r","v":"Le montant maximum à allouer à un investissement spéculatif est celui que tu peux perdre entièrement sans que ça compromette ta vie."},{"t":"b","v":"Les grandes fortunes se font rarement en mettant tout sur un seul coup. Elles se font en prenant des risques mesurés, en se trompant parfois, mais en conservant toujours suffisamment de capital pour continuer."},{"t":"c","v":"\"Risquer ce qu'on a pour avoir ce qu'on n'a pas, c'est parfois juste. Risquer ce dont on a besoin pour avoir ce qu'on veut, c'est rarement sage.\""}],"q":{"text":"Tu t'es déjà retrouvé dans une situation similaire ?","opts":["Oui, et j'y ai réfléchi longuement","Oui, et j'ai regretté","Non, mais je veux être préparé"],"hints":["La réflexion est la meilleure protection.","C'est une expérience difficile mais précieuse. Ce module va t'aider à ne pas la répéter.","C'est exactement la bonne démarche — comprendre avant que ça arrive."],"ctas":["Voir comment évaluer une opportunité","Voir ce que ça implique pour moi","Me préparer à ce type de situation"]},"cta":"Voir ce que ça implique pour moi","nxt":"p33","ntitle":"Pourquoi certains gagnent beaucoup... et d'autres perdent","isPremium":true},"p33":{"mod":"Premium · Module 3","modId":"pm3","ch":"4 / 4","title":"Pourquoi certains gagnent beaucoup... et d'autres perdent","tag":"Cas concret","tb":"#FEF3C7","tc":"#92400E","min":6,"acc":"On entend les success stories. On entend moins les échecs. Pourtant, comprendre pourquoi certains réussissent là où d'autres échouent est l'une des leçons les plus précieuses.","secs":[{"t":"b","v":"La première raison de la différence de résultats : le comportement, pas le produit. Deux personnes qui investissent dans le même ETF sur la même période peuvent avoir des résultats très différents selon leurs comportements."},{"t":"b","v":"La deuxième raison : l'horizon de temps. Les personnes qui ont construit des patrimoines significatifs n'ont généralement pas trouvé le bon moment. Elles ont investi tôt, régulièrement, et attendu longtemps."},{"t":"e","title":"Deux investisseurs, même marché","v":"Marc et Sophie commencent en 2015, investissent tous les deux 500 €/mois en ETF monde.\n\nMarc :\n→ Vend tout lors du krach Covid (mars 2020) : -30 %\n→ Réinvestit 8 mois après, le marché a déjà rebondi de +40 %\n→ Performance finale 2015-2024 : +58 %\n\nSophie :\n→ Continue d'investir ses 500 €/mois sans s'arrêter\n→ N'a pas touché à son portefeuille pendant 9 ans\n→ Performance finale 2015-2024 : +134 %\n\nMême produit. Même montant. Même durée. Résultat : ×2,3 d'écart."},{"t":"r","v":"La différence entre les investisseurs qui réussissent et ceux qui échouent tient rarement au produit choisi. Elle tient au comportement, à la régularité, et à la discipline face aux émotions."},{"t":"b","v":"Il n'existe pas de formule magique. Mais il existe des principes éprouvés : commencer tôt, investir régulièrement, diversifier, ne pas réagir aux émotions, minimiser les frais."},{"t":"c","v":"\"La richesse n'est pas le résultat d'un coup de génie. C'est le résultat de bonnes habitudes maintenues sur une longue période.\""}],"q":{"text":"Qu'est-ce qui différencie le plus les investisseurs qui réussissent ?","opts":["Ils choisissent les bons produits","Ils sont disciplinés et réguliers","Ils ont de la chance au bon moment"],"hints":["Les produits comptent, mais le comportement compte encore plus.","Exactement — c'est la conclusion de la plupart des études.","La chance joue parfois, mais la discipline la surpasse toujours sur le long terme."],"ctas":["Voir comment devenir plus discipliné","Voir ce que ça implique pour moi","Mettre en place mes bonnes habitudes"]},"cta":"Voir ce que ça implique pour moi","nxt":null,"ntitle":null,"isPremium":true},"news1":{"mod":"Actualité","modId":"news","ch":"","title":"Tensions géopolitiques au Moyen-Orient : pourquoi les marchés financiers ont réagi","tag":"Marchés · Fév. 2026","tb":"#FEF2F2","tc":"#EF4444","min":6,"acc":"Depuis fin février 2026, des tensions géopolitiques majeures au Moyen-Orient ont provoqué la fermeture du détroit d'Ormuz et fait réagir les marchés financiers mondiaux. Voici comment comprendre ce mécanisme.","secs":[{"t":"intro","headline":"28 fév. 2026","subline":"Frappes américano-israéliennes sur l'Iran — le conflit qui a tout changé","stats":[{"val":"−5 %","lbl":"CAC 40 en quelques semaines"},{"val":"+15 %","lbl":"Prix du pétrole au 1er jour"},{"val":"Fermé","lbl":"Détroit d'Ormuz"}],"color":"#EF4444"},{"t":"b","v":"Les marchés financiers sont sensibles à tout ce qui crée de l'incertitude. Une tension géopolitique majeure — conflit armé, blocus d'une route commerciale, crise diplomatique — génère une incertitude sur l'économie mondiale : livraisons perturbées, prix de l'énergie en hausse, ralentissement possible."},{"t":"b","v":"Le détroit d'Ormuz, point de passage de 20 % du pétrole mondial, est au cœur des tensions. Une perturbation même temporaire de ce corridor ferait monter le prix du brut, ce qui pèse sur les coûts des entreprises et donc sur leurs bénéfices anticipés."},{"t":"e","title":"Ce qui s'est passé sur les marchés","v":"Depuis le 28 février (début des frappes) :\n→ Le CAC 40 a reculé de plus de 5 % en quelques semaines\n→ Le pétrole (Brent) a bondi de +15 % dès les premiers jours\n→ L'or, valeur refuge, a progressé de +4 %\n→ Le dollar s'est apprécié face à l'euro (refuge historique)\n→ Inflation France : rebond à 1,7 % en mars 2026 (énergie +7,3 %)\n\nCe mouvement est classique en période de tensions géopolitiques."},{"t":"r","v":"Les marchés réagissent à l'incertitude, pas nécessairement à la réalité économique. Une résolution du conflit peut provoquer un rebond aussi rapide que la baisse. C'est pourquoi les investisseurs à long terme évitent de réagir à ces épisodes."},{"t":"b","v":"Ce type d'épisode illustre pourquoi l'horizon de placement est important : sur une journée ou une semaine, les mouvements peuvent être violents et anxiogènes. Sur 10 ans, ce type de choc a historiquement été absorbé par les marchés."},{"t":"c","v":"\"Les crises géopolitiques font partie du bruit de fond des marchés. L'investisseur long terme les regarde passer — l'investisseur court terme les subit.\""}],"q":{"text":"","opts":[],"hints":[],"ctas":[]},"cta":"","nxt":null,"ntitle":null,"isPremium":false,"isNews":true},"news2":{"mod":"Actualité","modId":"news","ch":"","title":"Livret A, LDDS et LEP : les nouveaux taux au 1er février 2026","tag":"Taux · Fév. 2026","tb":"#EEF2FF","tc":"#1E3A8A","min":6,"acc":"Au 1er février 2026, le gouvernement a révisé les taux des livrets réglementés. Le Livret A et le LDDS passent à 1,5 %. Le LEP reste à 2,5 %. Voici ce que ça signifie concrètement.","secs":[{"t":"intro","headline":"1er février 2026","subline":"Révision officielle des taux — ce que ça change pour ton épargne","stats":[{"val":"1,5 %","lbl":"Livret A & LDDS"},{"val":"2,5 %","lbl":"LEP (meilleur taux)"},{"val":"−1,5pt","lbl":"Depuis le pic de 2023"}],"color":"#1E3A8A"},{"t":"b","v":"Les taux des livrets réglementés sont fixés par arrêté ministériel et révisés tous les six mois (1er février et 1er août). Ils sont calculés à partir de la moyenne des taux interbancaires et de l'inflation. Avec une inflation revenue autour de 1 % début 2026, une baisse des taux était prévisible."},{"t":"e","title":"Les nouveaux taux au 1er février 2026","v":"Livret A → 1,5 %/an (contre 3 % en 2023-2024)\nPlafond : 22 950 € · Accessible à tous\n\nLDDS → 1,5 %/an\nPlafond : 12 000 € · Accessible à tous\n\nLEP → 2,5 %/an (inchangé)\nPlafond : 10 000 € · Sous conditions de ressources\n\nPEL (ouvert depuis janv. 2026) → 2 %/an"},{"t":"r","v":"Le LEP (Livret d'Épargne Populaire) offre toujours le meilleur taux parmi les livrets réglementés. Si vous êtes éligible (revenus sous un certain seuil), c'est le premier livret à utiliser avant le Livret A."},{"t":"b","v":"La baisse du Livret A de 3 % à 1,5 % représente une division par deux du rendement. Pour 10 000 € placés, cela représente 150 € d'intérêts annuels au lieu de 300 €. L'impact est notable pour les épargnants qui utilisaient le Livret A comme placement principal."},{"t":"b","v":"À noter : le taux du Livret A à 1,5 % avait été fixé sur la base d'une inflation à 0,8 % en décembre 2025. Depuis, l'inflation a rebondi à 1,7 % en mars 2026 sous l'effet des tensions au Moyen-Orient. Le Livret A offre donc désormais un rendement réel légèrement négatif — seul le LEP (2,5 %) protège encore le pouvoir d'achat."},{"t":"c","v":"\"Un taux réglementé à la baisse, ce n'est pas une mauvaise nouvelle en soi — c'est souvent le signe que l'inflation elle-même a baissé. Ce qui compte, c'est le rendement réel : après inflation.\""}],"q":{"text":"","opts":[],"hints":[],"ctas":[]},"cta":"","nxt":null,"ntitle":null,"isPremium":false,"isNews":true},"news3":{"mod":"Actualité","modId":"news","ch":"","isNews":true,"isPremium":false,"tag":"Inflation · Mars 2026","tb":"#FFFBEB","tc":"#92400E","min":7,"title":"Inflation à 1,7 % en mars 2026 : le rebond du choc pétrolier","acc":"En mars 2026, l'inflation française a rebondi à 1,7 % sur un an, contre 0,9 % en février. Ce retournement, lié à la flambée des prix de l'énergie depuis les tensions au Moyen-Orient, change la donne pour les épargnants.","secs":[{"t":"intro","headline":"Mars 2026","subline":"Rebond de l'inflation sous l'effet de la flambée énergétique","stats":[{"val":"1,7 %","lbl":"Inflation mars 2026"},{"val":"+7,3 %","lbl":"Énergie sur un an"},{"val":"−0,2 %","lbl":"Rendement réel Livret A"}],"color":"#D97706"},{"t":"b","v":"L'inflation, c'est la hausse générale des prix sur un an. Fin 2025, elle était à 0,8 % en France — un niveau bas, favorable aux épargnants. Depuis fin février 2026, le contexte a radicalement changé."},{"t":"e","title":"Ce que disent les chiffres de l'INSEE","v":"Décembre 2025 : +0,8 % sur un an (base qui a fixé les taux de fév. 2026)\nJanvier 2026 : +0,3 % sur un an\nFévrier 2026 : +0,9 % sur un an\nMars 2026 : +1,7 % sur un an ← rebond brutal\n\nPrincipale cause : les prix de l'énergie +7,3 % sur un an en mars\n(contre -2,9 % en février, avant les tensions au Moyen-Orient)."},{"t":"b","v":"Ce rebond de l'inflation change le rapport entre les taux des livrets et le pouvoir d'achat. En décembre 2025, le Livret A à 1,5 % offrait un rendement réel positif de +0,7 %. En mars 2026, avec une inflation à 1,7 %, ce même Livret A offre un rendement réel négatif de -0,2 %."},{"t":"e","title":"Ce que ça signifie concrètement","v":"Pour 10 000 € sur Livret A (1,5 %/an) en 2026 :\n→ Intérêts annuels : +150 €\n→ Inflation mars 2026 (1,7 %/an) : -170 € de pouvoir d'achat\n→ Rendement réel : -20 € (perte de pouvoir d'achat)\n\nPour 10 000 € sur LEP (2,5 %/an) :\n→ Intérêts annuels : +250 €\n→ Rendement réel : +80 € (protection maintenue)"},{"t":"r","v":"Le LEP à 2,5 % reste le seul livret réglementé qui protège réellement le pouvoir d'achat en mars 2026. Si vous êtes éligible au LEP (conditions de revenus), c'est le placement de précaution le plus efficace dans le contexte actuel."},{"t":"b","v":"L'INSEE anticipe une poursuite du rebond au printemps 2026 si les prix du pétrole se maintiennent autour de 100 $ le baril. L'inflation pourrait dépasser 2 % dès mai 2026. La prochaine révision des taux des livrets interviendra au 1er août 2026 — les taux pourraient remonter si l'inflation se maintient."},{"t":"c","v":"\"L'inflation à 1,7 % en mars, c'est le signal que les tensionsau Moyen-Orient ont des effets concrets sur le portefeuille des Français — y compris sur le rendement réel de l'épargne.\""}],"q":{"text":"","opts":[],"hints":[],"ctas":[]},"cta":"","nxt":null,"ntitle":null},"a55":{"mod":"Module 5","modId":"m5","ch":"6 / 6","title":"Investir 1 an ou 20 ans ? La leçon d'Air Liquide","tag":"Marchés","tb":"#EEF2FF","tc":"#1E3A8A","min":7,"acc":"Air Liquide est l'une des rares entreprises au monde à avoir distribué un dividende chaque année depuis 1902. Elle illustre mieux que tout la différence entre l'horizon court terme et l'horizon long terme.","secs":[{"t":"b","v":"La question « quand vais-je avoir besoin de cet argent ? » est peut-être la plus importante en finance personnelle. Elle détermine le niveau de risque acceptable — et la différence de résultat peut être considérable."},{"t":"h","v":"Air Liquide : un cas réel sur 20 ans"},{"t":"b","v":"Air Liquide est un groupe français leader mondial des gaz industriels et médicaux. Fondé en 1902, présent dans 72 pays, il fait partie du CAC 40. Sa particularité : c'est l'une des entreprises les plus stables de la bourse française, avec des revenus récurrents et prévisibles."},{"t":"k","v":"122 ans","lbl":"d'existence d'Air Liquide\nDividende distribué sans interruption depuis 1902"},{"t":"h","v":"Scénario A : tu investis pour 1 an"},{"t":"e","title":"Court terme — volatilité réelle","v":"Janvier 2022 → cours : ~165 €\nMars 2022 (crise Ukraine, inflation) → cours : ~136 €\nVariation en 3 mois : -17,5 %\n\nSi tu avais eu besoin de l'argent en mars 2022,\ntu aurais revendu à perte. Le timing compte énormément\nsur des horizons courts."},{"t":"h","v":"Scénario B : tu investis pour 20 ans"},{"t":"e","title":"Long terme — la puissance du temps","v":"Cours Air Liquide :\n→ 2004 : ~40 € (ajusté splits)\n→ 2014 : ~80 €\n→ 2024 : ~170 €\n\nPerformance 20 ans : +325 % (cours seul)\n+ dividendes réinvestis : +480 % environ\n→ 1 000 € investis en 2004 ≈ 5 800 € en 2024\n\n(données indicatives — sources : Euronext / Bloomberg)"},{"t":"h","v":"Le graphique mental à retenir"},{"t":"b","v function _authHeaders(){
  var h = {
    'Content-Type': 'application/json',
    'apikey': SUPA_KEY
  };
  if(_token) h['Authorization'] = 'Bearer ' + _token;
  return h;
}

function _supa(method, path, body){
  return fetch(SUPA_URL + path, {
    method:  method,
    headers: _authHeaders(),
    body:    body ? JSON.stringify(body) : undefined
  }).then(function(r){
    console.log('_supa', method, path, 'status:', r.status);
    return r.json();
  });
}

function _rest(method, table, body, query){
  var url = SUPA_URL + '/rest/v1/' + table + (query||'');
  var headers = _authHeaders();
  if(method==='POST' || method==='PATCH') headers['Prefer'] = 'return=minimal';
  if(method==='POST') headers['Prefer'] = 'resolution=merge-duplicates,return=minimal';
  return fetch(url, {
    method:  method,
    headers: headers,
    body:    body ? JSON.stringify(body) : undefined
  }).then(function(r){
    if(r.status === 204 || r.status === 200){
      return r.text().then(function(t){ return t ? JSON.parse(t) : {}; });
    }
    return r.json();
  });
}

/* Session persistante via localStorage */
function _saveSession(token, uid){
  _token = token;
  _uid   = uid;
  try { localStorage.setItem('mpc_token', token); localStorage.setItem('mpc_uid', uid); } catch(e){}
}
function _clearToken(){
  _token = null; _uid = null;
  try { localStorage.removeItem('mpc_token'); localStorage.removeItem('mpc_uid'); } catch(e){}
}
function _getSavedSession(){
  try {
    var t = localStorage.getItem('mpc_token');
    var u = localStorage.getItem('mpc_uid');
    return (t && u) ? {token:t, uid:u} : null;
  } catch(e){ return null; }
}

/* ══════════════════════════════════════════════════════════════
   INITIALISATION
   ══════════════════════════════════════════════════════════════ */
function initSupabase(){
  /* Essayer de restaurer la session sauvegardée */
  var saved = _getSavedSession();
  if(saved){
    _token = saved.token;
    _uid   = saved.uid;
    /* Vérifier que le token est encore valide */
    _supa('GET', '/auth/v1/user')
      .then(function(res){
        if(res && res.id){
          USER = { id: res.id, email: res.email,
            name: (res.user_metadata && res.user_metadata.name) || res.email.split('@')[0] };
          _loadProfile(res.id);
        } else {
          _clearToken();
          authRender();
        }
      })
      .catch(function(){ _clearToken(); authRender(); });
  } else {
    authRender();
  }
}

/* ── Chargement des données utilisateur ── */
function _loadProfile(uid){
  _rest('GET', 'profiles', null, '?id=eq.'+uid+'&limit=1')
    .then(function(rows){
      var p = Array.isArray(rows) ? rows[0] : null;
      if(p){
        IS_PREM  = p.is_premium || false;
        if(p.name) USER.name = p.name;
        if(p.quiz_done){
          PROFIL = {
            done: true, step: 0,
            revenus:     p.revenus||'',     revenus_num: p.revenus_num||0,
            epargne:     p.epargne||'',     epargne_num: p.epargne_num||0,
            situation:   p.situation||'',   objectif:    p.objectif||'',
            horizon:     p.horizon||'',     risque:      p.risque||''
          };
        }
        _loadProgress(uid);
      } else {
        /* Profil absent — le créer maintenant */
        _rest('POST','profiles',{
          id: uid, email: USER?USER.email:'', name: USER?USER.name:'',
          is_premium: false, quiz_done: false
        }).then(function(){ _loadProgress(uid); })
          .catch(function(){ IS_AUTHED=true; bootApp(); });
      }
    })
    .catch(function(){ IS_AUTHED=true; bootApp(); });
}

function _loadProgress(uid){
  _rest('GET', 'progress', null, '?user_id=eq.'+uid+'&select=article_id')

function authRender(){
  var sc=document.getElementById('sc');
  var tabs=document.getElementById('tabs');
  if(!sc) return;
  if(tabs) tabs.style.display='none';
  sc.style.bottom='0';
  if     (AUTH_SCREEN==='splash') sc.innerHTML=AUTH_SPLASH();
  else if(AUTH_SCREEN==='login')  sc.innerHTML=AUTH_LOGIN();
  else if(AUTH_SCREEN==='signup') sc.innerHTML=AUTH_SIGNUP();
  else if(AUTH_SCREEN==='forgot') sc.innerHTML=AUTH_FORGOT();
  else if(AUTH_SCREEN==='verify') sc.innerHTML=AUTH_VERIFY();
  else if(AUTH_SCREEN==='reset')  sc.innerHTML=AUTH_RESET();
}

function bootApp(){
  IS_AUTHED=true; AUTH_SCREEN='splash';
  var sc=document.getElementById('sc');
  var tabs=document.getElementById('tabs');
  if(sc)   sc.style.bottom='54px';
  if(tabs) tabs.style.display='flex';
  CT=0; CS='home'; SH=[];
  updTabs(); RENDER();
  /* Vérifier si on revient d'un paiement Stripe */
  checkStripeReturn();
}

function signOut(){
  try {
    if(_token) _supa('POST','/auth/v1/logout').catch(function(){});
  } catch(e){}
  _clearSession();
  /* Recharger la page proprement */
  AUTH_SCREEN='splash'; AUTH_ERR=''; AUTH_LOADING=false;
  var sc=document.getElementById('sc');
  var tabs=document.getElementById('tabs');
  if(sc) sc.style.bottom='0';
  if(tabs) tabs.style.display='none';
  authRender();
}

   ACTIONS AUTH

function doLogin(){
  var em=document.getElementById('l-email');
  var pw=document.getElementById('l-pass');
  if(!em||!pw) return;
  var email=em.value.trim().toLowerCase(), pass=pw.value;
  AUTH_ERR='';
  if(!email||!pass){AUTH_ERR='Remplis tous les champs.';authRender();return;}
  AUTH_LOADING=true; authRender();

  _supa('POST','/auth/v1/token?grant_type=password',{email:email,password:pass})
    .then(function(res){
      AUTH_LOADING=false;
      /* DEBUG — affiche la réponse brute de Supabase */
      console.log('Supabase login response:', JSON.stringify(res));
      if(res.error||res.error_description||res.code||res.msg){
        /* Afficher aussi dans l'UI pour debug */
        var rawErr = JSON.stringify(res);
        console.error('Auth error:', rawErr);
        /* Mapper les erreurs Supabase en messages lisibles */
        var errMsg = res.error_description || res.msg || res.message || res.error || '';
        if(errMsg.indexOf('Email not confirmed')>=0||errMsg.indexOf('not confirmed')>=0){
          AUTH_ERR='Confirme ton email avant de te connecter. Vérifie ta boîte mail.';
        } else if(res.error==='invalid_grant'){
          AUTH_ERR='Email ou mot de passe incorrect.';
        } else if(errMsg.indexOf('Invalid')>=0){
          AUTH_ERR='Email ou mot de passe incorrect.';
        } else {
          AUTH_ERR=errMsg||'Erreur de connexion. Réessaie.';
        }
        authRender();
      } else if(res.access_token){
        _saveSession(res.access_token, res.user.id);
        USER={id:res.user.id,email:res.user.email,
          name:(res.user.user_metadata&&res.user.user_metadata.name)||res.user.email.split('@')[0]};
        _loadProfile(res.user.id);
      } else {
        /* Réponse inattendue — ne pas rester bloqué */
        AUTH_ERR='Réponse inattendue du serveur. Réessaie.';
        authRender();
      }
    })
    .catch(function(){AUTH_LOADING=false;AUTH_ERR='Erreur réseau. Vérifie ta connexion.';authRender();});
}

function doSignup(){
  var en=document.getElementById('s-name');
  var ee=document.getElementById('s-email');
  var ep=document.getElementById('s-pass');
  if(!en||!ee||!ep) return;
  var name=en.value.trim(), email=ee.value.trim().toLowerCase(), pass=ep.value;
  AUTH_ERR='';
  if(!name||!email||!pass){AUTH_ERR='Remplis tous les champs.';authRender();return;}
  if(!CGU_OK){AUTH_ERR='Tu dois accepter les CGU pour continuer.';authRender();return;}
  if(pass.length<8){AUTH_ERR='Mot de passe trop court (8 caractères minimum).';authRender();return;}
  AUTH_LOADING=true; authRender();

  _supa('POST','/auth/v1/signup',{email:email,password:pass,data:{name:name}})
    .then(function(res){
      AUTH_LOADING=false;
      console.log('Signup response:', JSON.stringify(res));
      if(res.error||res.code){
        AUTH_ERR=res.msg||res.error_description||res.error||'Erreur lors de la création du compte.';
        authRender();
      } else if(res.access_token){
        /* Confirmation désactivée — connexion automatique */
        _saveSession(res.access_token, res.user.id);
        USER={id:res.user.id,email:res.user.email,
          name:(res.user.user_metadata&&res.user.user_metadata.name)||res.user.email.split('@')[0]};
        /* Créer le profil manuellement (plus de trigger) */
        _rest('POST','profiles',{
          id:    res.user.id,
          email: res.user.email,
          name:  USER.name,
          is_premium: false,
          quiz_done:  false
        }).catch(function(){/* profil peut déjà exister */});
        /* Charger les données */
        _loadProfile(res.user.id);
      } else {
        /* Confirmation requise */
        AUTH_SCREEN='verify'; authRender();
      }
    })
    .catch(function(){AUTH_LOADING=false;AUTH_ERR='Erreur réseau. Vérifie ta connexion.';authRender();});
}

function doForgot(){
  var fe=document.getElementById('f-email');
  if(!fe) return;
  var email=fe.value.trim().toLowerCase();
  AUTH_ERR='';
  if(!email){AUTH_ERR='Entre ton adresse email.';authRender();return;}
  AUTH_LOADING=true; authRender();

  _supa('POST','/auth/v1/recover',{email:email})
    .then(function(){AUTH_LOADING=false;AUTH_SCREEN='verify';authRender();})
    .catch(function(){AUTH_LOADING=false;AUTH_ERR='Erreur réseau.';authRender();});
}

function doVerify(){
  AUTH_SCREEN='login';
  AUTH_ERR='';
  authRender();
}

function doReset(){
  var np=document.getElementById('r-pass');
  var np2=document.getElementById('r-pass2');
  if(!np||!np2) return;
  var pass=np.value, pass2=np2.value;
  AUTH_ERR='';
  if(pass.length<8){AUTH_ERR='8 caractères minimum.';authRender();return;}
  if(pass!==pass2){AUTH_ERR='Les mots de passe ne correspondent pas.';authRender();return;}
  AUTH_LOADING=true; authRender();

  _supa('PUT','/auth/v1/user',{password:pass})
    .then(function(res){
      AUTH_LOADING=false;
      if(res.error){AUTH_ERR=res.error;authRender();}
      else{AUTH_SCREEN='login';AUTH_ERR='';authRender();}
    })
    .catch(function(){AUTH_LOADING=false;AUTH_ERR='Erreur réseau.';authRender();});
}

function processPayment(){
  PAY_ERR=''; PAY_STEP='processing'; CS='paywall'; RENDER();

  /* Charger Stripe.js si pas encore chargé */
  if(!STRIPE_LOADED){
    var script=document.createElement('script');
    script.src='https://js.stripe.com/v3/';
    script.onload=function(){ STRIPE_LOADED=true; _doStripeCheckout(); };
    script.onerror=function(){ PAY_STEP='form'; PAY_ERR='Impossible de charger Stripe. Vérifie ta connexion.'; CS='paywall'; RENDER(); };
    document.head.appendChild(script);
  } else {
    _doStripeCheckout();
  }
}

function _doStripeCheckout(){
  try {
    var stripe = window.Stripe(STRIPE_PK);
    var priceId = PAY_PLAN==='annual' ? STRIPE_PRICE_Y : STRIPE_PRICE_M;
    var origin  = window.location.origin + window.location.pathname;

    stripe.redirectToCheckout({
      lineItems: [{price: priceId, quantity: 1}],
      mode: 'subscription',
      successUrl: origin + '?payment=success&session_id={CHECKOUT_SESSION_ID}',
      cancelUrl:  origin + '?payment=cancel',
      clientReferenceId: _uid || 'anonymous',
      customerEmail: USER ? USER.email : undefined,
    }).then(function(result){
      if(result.error){
        PAY_STEP='form';
        PAY_ERR=result.error.message||'Erreur de paiement.';
        CS='paywall'; RENDER();
      }
    });
  } catch(e){
    PAY_STEP='form';
    PAY_ERR='Erreur Stripe : '+e.message;
    CS='paywall'; RENDER();
  }
}

/* Vérifier le retour Stripe après paiement */
function checkStripeReturn(){
  var params=new URLSearchParams(window.location.search);
  if(params.get('payment')==='success'){
    /* Activer le premium */
    IS_PREM=true;
    if(_uid){
      _rest('POST','profiles',{
        id:_uid, is_premium:true,
        premium_since:new Date().toISOString()
      }).catch(function(){});
    }
    /* Nettoyer l'URL */
    window.history.replaceState({},'',window.location.pathname);
    /* Afficher l'écran de succès */
    PAY_STEP='success'; CS='paywall'; RENDER();
  } else if(params.get('payment')==='cancel'){
    window.history.replaceState({},'',window.location.pathname);
  }
}

function formatCC(el){
  var v=el.value.replace(/\D/g,'').substring(0,16);
  el.value=v.replace(/(.{4})/g,'$1 ').trim();
  PAY_CARD.num=v;
}
function formatExp(el){
  var v=el.value.replace(/\D/g,'').substring(0,4);
  if(v.length>2) v=v.substring(0,2)+'/'+v.substring(2);
  el.value=v;
  PAY_CARD.exp=v;
}
function updateCard(field,val){
  PAY_CARD[field]=val;

/* ── STREAK ── */
function getStreak(){
 var today=new Date().toDateString();
 if(STREAK.lastDate===today) return STREAK.count;
 var yesterday=new Date(Date.now()-86400000).toDateString();
 if(STREAK.lastDate===yesterday) STREAK.count++;
 else STREAK.count=1;
 STREAK.lastDate=today;
 return STREAK.count;
}

function getHealthScore(){
 var score=0,max=0;
 var pct=Math.round(COMPLETED.size/46*100);
 score+=Math.round(pct*0.30); max+=30;
 if(BUDGET_DATA&&BUDGET_DATA.done){
  score+=10; max+=20;
  var BD=BUDGET_DATA;
  var rev=(BD.revenus.salaire||0)+(BD.revenus.autres||0);
  var epg=BD.epargne_obj||0;
  var tauxEpg=rev>0?Math.round(epg/rev*100):0;
  if(tauxEpg>=15)score+=10;else if(tauxEpg>=10)score+=7;else if(tauxEpg>=5)score+=3;
 } else { max+=20; }
 if(PROFIL&&PROFIL.done){
  score+=15; max+=25;
  var planDone=PLAN_CHECKS?Object.keys(PLAN_CHECKS).filter(function(k){return PLAN_CHECKS[k];}).length:0;
  score+=Math.min(10,planDone*3);
 } else { max+=25; }
 if(BUDGET_DATA&&BUDGET_DATA.checkin&&BUDGET_DATA.checkin.mois){score+=15;}
 max+=15;
 var streak=(typeof getStreak==='function')?getStreak():0;
 score+=Math.min(10,streak*2); max+=10;
 return max>0?Math.round(score/max*100):0;
}

function BUDGET_DASH(){
 var BD=BUDGET_DATA;
 var rev=(BD.revenus.salaire||0)+(BD.revenus.autres||0);
 var f=BD.fixes,v=BD.variables,p=BD.plaisir;
 var totalFixes=(f.loyer||0)+(f.credits||0)+(f.assurances||0)+(f.abonnements||0);
 var totalVar=(v.alimentation||0)+(v.transport||0)+(v.sante||0);
 var totalPlaisir=(p.restaurant||0)+(p.loisirs||0)+(p.shopping||0);
 var totalDep=totalFixes+totalVar+totalPlaisir;
 var reste=rev-totalDep;
 var epgObj=BD.epargne_obj||0;
 var tauxEpg=rev>0?Math.round(epgObj/rev*100):0;
 var loyerPct=rev>0?Math.round((f.loyer||0)/rev*100):0;
 var fixesPct=rev>0?Math.round(totalFixes/rev*100):0;
 var plaisirPct=rev>0?Math.round(totalPlaisir/rev*100):0;
 var deficit=totalDep+epgObj>rev;

 /* ── Score budgétaire ──────────────────────────────── */
 var score=100;
 if(tauxEpg<5) score-=30;
 else if(tauxEpg<10) score-=15;
 else if(tauxEpg>=20) score+=5;
 if(loyerPct>40) score-=20;
 else if(loyerPct>33) score-=10;
 if(deficit) score-=25;
 if(plaisirPct>25) score-=10;
 if((f.credits||0)>rev*0.2) score-=10;
 score=Math.max(0,Math.min(100,score));
 var grade=score>=85?'A':score>=70?'B':score>=55?'C':score>=40?'D':'F';
 var gradeColor=score>=85?'#10B981':score>=70?'#3B82F6':score>=55?'#F59E0B':score>=40?'#F97316':'#EF4444';
 var gradeMsg=score>=85?'Structure excellente — continue ainsi':score>=70?'Bonne structure — quelques ajustements possibles':score>=55?'Structure correcte — des marges existent':score>=40?'Structure tendue — des optimisations sont nécessaires':'Budget en tension — à revoir en priorité';

 /* ── Insights automatiques ─────────────────────────── */
 var insights=[];
 // Taux d'épargne vs moyenne française (15%)
 if(tauxEpg<10){
  insights.push({type:'warn',
   title:'Taux d\'épargne bas ('+tauxEpg+' %)',
   body:'La moyenne française est autour de 15 %. Avec '+tauxEpg+' %, il te reste peu de marge en cas d\'imprévu. Chaque point de taux d\'épargne gagné représente '+fmt(Math.round(rev*0.01*12))+'€/an supplémentaires mis de côté.',
   icon:'📉'});
 } else if(tauxEpg>=15){
  insights.push({type:'ok',
   title:'Bon taux d\'épargne ('+tauxEpg+' %)',
   body:'Tu es au-dessus de la moyenne française (~15 %). Sur 10 ans à '+fmt(epgObj)+'€/mois avec 4%/an (hypothèse indicative) → environ '+fmt(Math.round(epgObj*((Math.pow(1.04,10)-1)/(0.04/12*12))))+' €. Bien joué.',
   icon:'📈'});
 }
 // Logement
 if(loyerPct>33){
  var loyerIdeal=Math.round(rev*0.33);
  insights.push({type:'warn',
   title:'Logement à '+loyerPct+' % de tes revenus',
   body:'Le repère courant est < 33 %. Tes '+fmt(f.loyer||0)+'€ de loyer laissent peu de marge. Si ton logement coûtait '+fmt(loyerIdeal)+'€, tu aurais '+fmt((f.loyer||0)-loyerIdeal)+'€/mois de plus à allouer ailleurs.',
   icon:'🏠'});
 }
 // Crédits conso
 if((f.credits||0)>rev*0.15){
  var creditPct=Math.round((f.credits||0)/rev*100);
  insights.push({type:'warn',
   title:'Crédits à '+creditPct+' % des revenus',
   body:'Au-delà de 15-20 %, les crédits conso réduisent sérieusement ta capacité d\'épargne. Tes '+fmt(f.credits||0)+'€/mois de crédits correspondent à '+fmt((f.credits||0)*12)+'€/an — soit presque '+Math.round((f.credits||0)*12/Math.max(1,epgObj*12)*100)+' % de ton épargne annuelle.',
   icon:'💳'});
 }
 // Opportunité : réduire loisirs
 if(plaisirPct>15&&epgObj<rev*0.15){
  var loisirReduc=Math.round(totalPlaisir*0.2);
  insights.push({type:'tip',
   title:'Opportunité : -'+fmt(loisirReduc)+'€/mois sur les loisirs',
   body:'Réduire tes loisirs de 20 % libérerait '+fmt(loisirReduc)+'€/mois, soit '+fmt(loisirReduc*12)+'€/an d\'épargne supplémentaire. Avec intérêts composés sur 10 ans (4%/an indicatif) → +'+fmt(Math.round(loisirReduc*((Math.pow(1.04,10)-1)/(0.04/12*12))))+' €.',
   icon:'💡'});
 }
 // Alimentation vs moyenne
 var alimPct=rev>0?Math.round((v.alimentation||0)/rev*100):0;
 if(alimPct>20){
  insights.push({type:'tip',
   title:'Alimentation à '+alimPct+' % des revenus',
   body:'La moyenne française est ~15-18 % pour l\'alimentation. Tes '+fmt(v.alimentation||0)+'€/mois sont au-dessus. Acheter en promotion, cuisiner en batch ou faire ses courses avec une liste peut facilement réduire ce poste de 10-15 %.',
   icon:'🛒'});
 }
 // Déficit
 if(deficit){
  insights.push({type:'danger',
   title:'Attention : dépenses + épargne > revenus',
   body:'Ton plan actuel ('+fmt(totalDep)+'€ de dépenses + '+fmt(epgObj)+'€ d\'épargne = '+fmt(totalDep+epgObj)+'€) dépasse tes revenus de '+fmt(totalDep+epgObj-rev)+'€/mois. Il faut soit réduire les dépenses, soit ajuster l\'objectif d\'épargne.',
   icon:'🚨'});
 }
 if(!insights.length){
  insights.push({type:'ok',
   title:'Budget équilibré',
   body:'Ta structure budgétaire est cohérente. Charges fixes maîtrisées, taux d\'épargne correct. Continue sur cette lancée.',
   icon:'✅'});
 }

 /* ── Simulateur optimisation ────────────────────────── */
 var simLoisir=Math.round(totalPlaisir*0.2);
 var simAlimentation=Math.round((v.alimentation||0)*0.1);
 var simTotal=simLoisir+simAlimentation;
 var simAnnuel=simTotal*12;
